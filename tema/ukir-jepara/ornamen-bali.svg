    <path style="fill:none;stroke:var(--ukir-garis);stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;stroke-dasharray:1;stroke-dashoffset:var(--ukir-off,0)" pathLength="1" d="M8 20 C30 20 44 10 60 10 C74 10 80 20 72 26 C66 30 58 26 60 20 C62 15 70 16 70 21"/>
    <path style="fill:none;stroke:var(--ukir-garis);stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;stroke-dasharray:1;stroke-dashoffset:var(--ukir-off,0)" pathLength="1" d="M232 20 C210 20 196 10 180 10 C166 10 160 20 168 26 C174 30 182 26 180 20 C178 15 170 16 170 21"/>
    <path style="fill:none;stroke:var(--ukir-garis-dim);stroke-width:1.1;stroke-linecap:round;vector-effect:non-scaling-stroke;stroke-dasharray:1;stroke-dashoffset:var(--ukir-off,0)" pathLength="1" d="M84 20 H104 M136 20 H156"/>
    <path style="fill:none;stroke:var(--ukir-garis);stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;stroke-dasharray:1;stroke-dashoffset:var(--ukir-off,0)" pathLength="1" d="M120 34 C110 26 108 16 120 4 C132 16 130 26 120 34 Z"/>
    <path style="fill:none;stroke:var(--ukir-garis);stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;stroke-dasharray:1;stroke-dashoffset:var(--ukir-off,0)" pathLength="1" d="M120 28 C115 23 115 16 120 11 C125 16 125 23 120 28"/>
    <path style="fill:var(--ukir-isi);opacity:var(--ukir-daun,.85)" d="M120 24 c-2 -3 -2 -6 0 -9 c2 3 2 6 0 9z"/>
    <path style="fill:var(--ukir-isi);opacity:var(--ukir-daun,.85)" d="M104 20 c-4 -4 -2 -9 3 -9 c1 4 -1 7 -3 9z"/><path style="fill:var(--ukir-isi);opacity:var(--ukir-daun,.85)" d="M136 20 c4 -4 2 -9 -3 -9 c-1 4 1 7 3 9z"/>
  </g>
  <g id="sudut">
