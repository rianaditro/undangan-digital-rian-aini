<svg xmlns="http://www.w3.org/2000/svg">
  <!-- Ornamen daerah Bali untuk tema ukir-jepara (setelan daerah):
       patra — sulur yang bergulung ke dalam — dengan kuncup di tengah,
       seperti ukiran prada. -->
