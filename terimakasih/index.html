<!--
  Halaman kenangan, versi 2 (revisi 10 Oktober — migrasi 033).
  Rancangan: docs/kenangan.md. Susunan bab: assets/kenangan.js.

  Surat dari pengantin untuk yang hadir. Gulir = hari itu berjalan:
  sampul, pesan dari kami, mempelai pria, mempelai wanita, kedatangan
  keluarga, babak acara (akad, resepsi, …), sungkem, keluarga, para
  tamu, kami berdua, album, terima kasih kepada, penutup.

  Tiap bab berlatar foto/video yang bergiliran pelan, dengan tombol
  ‹ › dan usap mendatar untuk menggeser; potongannya (titik fokus +
  perbesaran, 034) diatur di dasbor untuk layar HP. Melihat satu per
  satu dan memperbesar ada di album paling bawah, yang memuat SEMUA
  foto. Ucapan tamu muncul kecil dan tembus pandang di pojok bawah;
  tamu bisa menyembunyikannya lewat tombol gelembung. Musik dan gulir otomatis menyala lewat
  tombol "Putar kenangan" di sampul — peramban tidak mengizinkan suara
  tanpa sentuhan tamu.

  Tidak pernah kosong: bab media tanpa foto tidak muncul kecuali
  pasangan menulis sesuatu untuknya; babak acara tanpa foto jadi kartu
  teks; sampul tanpa foto tetap nama, tanggal, dan kalimatnya.
-->

<script>
(function(){
  'use strict';
  var M = window.MENGUNDANG, K = window.Kenangan;
  var $ = function(id){ return document.getElementById(id); };
  var kurangi = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  var url = function(j){ return window.Gambar.url(j); };

  var BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli',
               'Agustus','September','Oktober','November','Desember'];
  function tanggalPanjang(iso){
    if (!iso) return '';
    var p = String(iso).slice(0,10).split('-');
    if (p.length !== 3) return '';
    return Number(p[2]) + ' ' + BULAN[Number(p[1]) - 1] + ' ' + p[0];
  }
  function judulKata(s){
    // huruf pertama tiap kata, melompati tanda baca di depannya:
    // 'AINI → 'Aini, MA'RUF → Ma'ruf
    return String(s || '').toLowerCase().replace(/(^|[\s-])([^a-z\s]*)([a-z])/g, function(m, a, b, c){ return a + b + c.toUpperCase(); });
  }

  /* ============================================================
     Media sebuah bab
     ============================================================ */
  var GILIR_FOTO = 6000;

  function angkaPotong(n, bawaan, lo, hi){
    n = Number(n);
    return isFinite(n) && n >= lo && n <= hi ? n : bawaan;
  }
  function potongan(f){
    return ' style="--fx:' + angkaPotong(f.fokus_x, 50, 0, 100) + '%;--fy:' + angkaPotong(f.fokus_y, 50, 0, 100)
      + '%;--z:' + angkaPotong(f.zum, 1, 1, 3) + '"';
  }
  /* Mode tampil per foto (035): pilihan pasangan, atau otomatis dari
     ukurannya — landscape tampil utuh, selain itu isi layar. */
  function modeTampil(f){
    if (f.tampilan === 'isi' || f.tampilan === 'utuh') return f.tampilan;
    return (f.lebar && f.tinggi && f.lebar > f.tinggi * 1.15) ? 'utuh' : 'isi';
  }
  function lapisHtml(f, i){
    var aktif = i === 0 ? ' aktif' : '';
    var utuh = modeTampil(f) === 'utuh';
    var malas = i === 0 ? '' : ' loading="lazy"';
    // latar buram: berkas yang sama (dari cache), atau poster untuk video
    var buram = utuh ? '<img class="buram" src="' + esc(url(f.jenis === 'video' ? (f.kecil || f.jalur) : f.jalur)) + '" alt=""' + malas + ' decoding="async">' : '';
    var kelas = 'lapis' + aktif + (utuh ? ' utuh' : '');
    if (f.jenis === 'video'){
      return '<div class="' + kelas + '" data-durasi="' + (f.durasi_ms || 0) + '"' + potongan(f) + '>' + buram
        + '<video class="utama" muted loop playsinline preload="' + (i === 0 ? 'metadata' : 'none') + '"'
        + (f.kecil ? ' poster="' + esc(url(f.kecil)) + '"' : '') + ' src="' + esc(url(f.jalur)) + '"></video></div>';
    }
    return '<div class="' + kelas + '"' + potongan(f) + '>' + buram + '<img class="utama" src="' + esc(url(f.jalur)) + '" alt=""'
      + malas + ' decoding="async"></div>';
  }

  /* Pusat foto "tampil utuh" = tengah ruang kosong di atas tulisan bab.
     Dihitung ulang kalau ukuran layar berubah (HP diputar, bilah alamat
     menyusut) dan sesudah huruf termuat. */
  function aturTengah(){
    document.querySelectorAll('.lapis.utuh').forEach(function(l){
      var bab = l.closest('section'); if (!bab || bab._tengahDiatur) return;
      bab._tengahDiatur = true;
      var isi = Array.prototype.slice.call(bab.children).filter(function(c){ return !c.classList.contains('latar'); })[0];
      if (!isi) return;
      var ruang = isi.getBoundingClientRect().top - bab.getBoundingClientRect().top;
      if (ruang > 120) bab.style.setProperty('--tengah', Math.round(ruang / 2) + 'px');
    });
    document.querySelectorAll('section').forEach(function(b){ b._tengahDiatur = false; });
  }

  function latarHtml(media, balik){
    return '<div class="latar' + (balik ? ' balik' : '') + '" aria-hidden="true">'
      + media.slice(0, 8).map(lapisHtml).join('') + '</div>';
  }

  /* Tombol geser hanya untuk bab yang punya lebih dari satu berkas.
     Melihat satu per satu dan memperbesar ada di album paling bawah. */
  function alatBabHtml(media){
    var n = Math.min(media.length, 8);
    if (n < 2) return '';
    return '<div class="alat-bab">'
      + '<button type="button" class="geser" data-geser="-1" aria-label="Foto sebelumnya">&#8249;</button>'
      + '<div class="titik">' + media.slice(0, 8).map(function(_, i){
          return '<button type="button" data-ke="' + i + '" aria-label="Foto ' + (i+1) + '"'
            + (i === 0 ? ' aria-current="true"' : '') + '></button>';
        }).join('') + '</div>'
      + '<button type="button" class="geser" data-geser="1" aria-label="Foto berikutnya">&#8250;</button>'
      + '</div>';
  }

  /* ============================================================
     Menyusun bab
     ============================================================ */
  var mediaBab = {};       // galeri → daftar media, untuk penampil

  function bangun(d){
    var foto = d.foto || [];
    var menurutBagian = {}, menurutAcara = {}, lepas = [];
    foto.forEach(function(f){
      if (f.bagian) (menurutBagian[f.bagian] = menurutBagian[f.bagian] || []).push(f);
      else if (f.acara_id) (menurutAcara[f.acara_id] = menurutAcara[f.acara_id] || []).push(f);
      else lepas.push(f);
    });

    var pria   = (d.mempelai && d.mempelai.pria)   || {};
    var wanita = (d.mempelai && d.mempelai.wanita) || {};
    var namaPria = judulKata(pria.panggilan), namaWanita = judulKata(wanita.panggilan);
    var blok = function(k){ return K.berlaku(d.blok, k); };

    /* ---- sampul ---- */
    if (namaPria || namaWanita){
      $('namaBesar').innerHTML = esc(namaPria) + ' <span class="nama-amp">&amp;</span> ' + esc(namaWanita);
      document.title = 'Terima Kasih — ' + namaPria + ' & ' + namaWanita;
    }
    $('tanggal').textContent = [tanggalPanjang(d.tanggal_acara), judulKata(d.kota)].filter(Boolean).join(' · ');
    var bs = blok('sampul');
    $('sampulJudul').textContent = bs.judul;
    $('sampulKalimat').textContent = bs.teks || '';
    var mediaSampul = menurutBagian.sampul || [];
    if (mediaSampul.length){
      $('sampul').insertAdjacentHTML('afterbegin', latarHtml(mediaSampul, false));
      $('sampul').dataset.bab = 'sampul';
    }

    /* ---- album: SEMUA foto dan video, berurutan seperti bab-babnya;
       yang tanpa bab di akhir. Bab di atas bercerita, album tempat
       melihat satu per satu. ---- */
    var album = [], sudah = {};
    function masuk(daftar){ (daftar || []).forEach(function(f){ if (!sudah[f.jalur + '|' + (f.id || '')]){ sudah[f.jalur + '|' + (f.id || '')] = 1; album.push(f); } }); }
    K.BLOK.forEach(function(def){
      if (def.jenis === 'media') masuk(menurutBagian[def.kunci]);
      if (def.jenis === 'acara'){
        (d.babak || []).forEach(function(a){ masuk(menurutAcara[a.id]); });
        Object.keys(menurutAcara).forEach(function(id){ masuk(menurutAcara[id]); });   // acara yang tidak jadi babak
      }
    });
    masuk(lepas);

    /* ---- bab-bab ---- */
    var html = [], urutBerfoto = 0;

    function babMedia(kunci, eyebrow, judul, kalimat, ket, media){
      if (!media.length){
        return '<section class="bab polos" data-bab="' + esc(kunci) + '"><div class="isi wrap">'
          + (eyebrow ? '<p class="eyebrow reveal">' + esc(eyebrow) + '</p>' : '')
          + '<h2 class="judul reveal">' + esc(judul) + '</h2>'
          + (ket ? '<p class="keterangan reveal">' + esc(ket) + '</p>' : '')
          + (kalimat ? '<p class="kalimat reveal">' + esc(kalimat) + '</p>' : '')
          + '<svg class="ukir pemisah reveal" viewBox="0 0 240 40" aria-hidden="true"><use href="#ukir-pemisah"/></svg>'
          + '</div></section>';
      }
      urutBerfoto++;
      var kanan = urutBerfoto % 2 === 0;
      return '<section class="bab' + (kanan ? ' kanan' : '') + '" data-bab="' + esc(kunci) + '">'
        + latarHtml(media, kanan)
        + '<div class="isi">'
        +   (eyebrow ? '<p class="eyebrow reveal">' + esc(eyebrow) + '</p>' : '')
        +   '<h2 class="judul reveal">' + esc(judul) + '</h2>'
        +   (ket ? '<p class="keterangan reveal">' + esc(ket) + '</p>' : '')
        +   (kalimat ? '<p class="kalimat reveal">' + esc(kalimat) + '</p>' : '')
        +   '<div class="reveal">' + alatBabHtml(media) + '</div>'
        + '</div></section>';
    }

    function orangTua(m){
      var ortu = [m.ayah, m.ibu].filter(Boolean).join(' & ');
      return ortu ? ((m.anak || '') + ' ' + ortu).trim() : '';
    }

    K.BLOK.forEach(function(def){
      var b = blok(def.kunci);
      if (!b.tampil || def.kunci === 'sampul' || def.kunci === 'ucapan') return;

      if (def.jenis === 'teks' && def.kunci !== 'penutup'){
        html.push('<section class="kertas" data-bab="' + def.kunci + '"><div class="wrap">'
          + '<svg class="ukir pemisah reveal" viewBox="0 0 240 40" aria-hidden="true" style="margin-top:0"><use href="#ukir-pemisah"/></svg>'
          + '<h2 class="judul reveal">' + esc(b.judul) + '</h2>'
          + (b.teks ? '<p class="kalimat reveal">' + esc(b.teks) + '</p>' : '')
          + '</div></section>');
        return;
      }

      if (def.jenis === 'media'){
        var media = menurutBagian[def.kunci] || [];
        if (!media.length && !b.ditulis) return;
        if (def.kunci === 'pria' || def.kunci === 'wanita'){
          var m = def.kunci === 'pria' ? pria : wanita;
          html.push(babMedia(def.kunci, def.kunci === 'pria' ? 'Mempelai Pria' : 'Mempelai Wanita',
            b.judul || judulKata(m.panggilan) || def.nama, b.teks, orangTua(m) || judulKata(m.lengkap), media));
        } else {
          html.push(babMedia(def.kunci, null, b.judul || def.nama, b.teks, null, media));
        }
        return;
      }

      if (def.jenis === 'acara'){
        (d.babak || []).forEach(function(a){
          var waktu = [a.tanggal, a.jam].filter(Boolean).join(' · ');
          html.push(babMedia('acara-' + a.id, waktu || null, a.nama || 'Acara', a.teks || K.teksBabak(a.nama), null, menurutAcara[a.id] || []));
        });
        return;
      }

      if (def.jenis === 'album'){
        if (!album.length) return;
        mediaBab.galeri = album;
        html.push('<section class="kertas" data-bab="galeri"><div class="wrap-lebar">'
          + '<h2 class="judul reveal">' + esc(b.judul) + '</h2>'
          + (b.teks ? '<p class="kalimat reveal">' + esc(b.teks) + '</p>' : '')
          + '<div class="album">' + album.map(function(f, i){
              var rasio = (f.lebar && f.tinggi) ? ' style="aspect-ratio:' + f.lebar + '/' + f.tinggi + '"' : '';
              return '<button type="button" class="reveal" data-lihat="galeri" data-i="' + i + '" aria-label="Buka ' + (f.jenis === 'video' ? 'video' : 'foto') + ' ' + (i+1) + '">'
                + '<img src="' + esc(url(f.kecil || f.jalur)) + '" alt="' + esc(f.keterangan || '') + '" loading="lazy" decoding="async"' + rasio + '>'
                + (f.jenis === 'video' ? '<span class="tanda-video" aria-hidden="true"><svg viewBox="0 0 32 32"><use href="#ikon-main"/></svg></span>' : '')
                + '</button>';
            }).join('') + '</div></div></section>');
        return;
      }

      function pitaVendor(v){
        function isi(salinan){
          var luar = salinan ? ' tabindex="-1"' : '';
          return '<ul class="vendor-isi"' + (salinan ? ' aria-hidden="true"' : '') + '>' + v.map(function(x){
            var tautan = '';
            if (/^@/.test(x.tautan || '')) tautan = '<a href="https://instagram.com/' + esc(x.tautan.slice(1)) + '" target="_blank" rel="noopener"' + luar + '>' + esc(x.tautan) + '</a>';
            else if (/^https?:\/\//.test(x.tautan || '')){
              var host = x.tautan.replace(/^https?:\/\/(www\.)?/, '').replace(/\/.*$/, '');
              tautan = '<a href="' + esc(x.tautan) + '" target="_blank" rel="noopener"' + luar + '>' + esc(host) + '</a>';
            }
            return '<li><span class="peran">' + esc(x.peran) + '</span><span class="nama">' + esc(x.nama) + '</span>' + tautan + '</li>';
          }).join('') + '</ul>';
        }
        // ±5 dtk per nama, paling cepat 24 dtk satu putaran
        return '<div class="vendor"><div class="vendor-jalur" style="--durasi:' + Math.max(24, v.length * 5) + 's">'
          + isi(false) + isi(true) + '</div></div>';
      }

      if (def.jenis === 'vendor'){
        var v = d.vendor || [];
        if (!v.length) return;
        html.push('<section id="vendor"><div class="wrap-lebar">'
          + '<h2 class="judul reveal">' + esc(b.judul) + '</h2>'
          + (b.teks ? '<p class="kalimat reveal">' + esc(b.teks) + '</p>' : '')
          + '</div>' + pitaVendor(v) + '</section>');
        return;
      }

      if (def.kunci === 'penutup'){
        html.push('<section class="kertas" data-bab="penutup"><div class="wrap">'
          + '<h2 class="judul reveal">' + esc(b.judul) + '</h2>'
          + (b.teks ? '<p class="kalimat reveal">' + esc(b.teks) + '</p>' : '')
          + '<div class="tanda-tangan reveal"><p class="oleh">Kami yang berbahagia</p>'
          + '<p class="nama">' + esc(namaPria) + ' &amp; ' + esc(namaWanita) + '</p></div>'
          + '<svg class="ukir pemisah reveal" viewBox="0 0 240 40" aria-hidden="true"><use href="#ukir-pemisah"/></svg>'
          + '</div></section>');
      }
    });

    $('cerita').innerHTML = html.join('');
  }

  /* ============================================================
     Giliran latar
     Hanya bab yang sedang terlihat yang bergilir; video hanya
     diputar selama lapisnya aktif DAN babnya terlihat.
     ============================================================ */
  function pasangGiliran(){
    var bab = Array.prototype.slice.call(document.querySelectorAll('[data-bab]'))
      .filter(function(el){ return el.querySelector('.latar'); });

    bab.forEach(function(el){
      var lapis = el.querySelectorAll('.lapis');
      var titik = el.querySelectorAll('.titik button');
      var ke = 0, jam = null, terlihat = false;

      function tampil(i){
        if (lapis[ke]){
          lapis[ke].classList.remove('aktif');
          var vl = lapis[ke].querySelector('video'); if (vl) vl.pause();
        }
        ke = (i + lapis.length) % lapis.length;
        lapis[ke].classList.add('aktif');
        titik.forEach(function(t, j){ t.setAttribute('aria-current', j === ke ? 'true' : 'false'); });
        var v = lapis[ke].querySelector('video');
        if (v && terlihat){ v.preload = 'auto'; v.play().catch(function(){}); }
        // lapis berikutnya disiapkan supaya tidak muncul kosong
        var nx = lapis[(ke + 1) % lapis.length];
        var nv = nx && nx.querySelector('video'); if (nv) nv.preload = 'metadata';
        jadwal();
      }
      function lama(){
        var d = Number(lapis[ke].dataset.durasi || 0);
        return d ? Math.min(15000, Math.max(GILIR_FOTO, d)) : GILIR_FOTO;
      }
      function jadwal(){
        clearTimeout(jam);
        if (!terlihat || kurangi || lapis.length < 2 || document.hidden) return;
        jam = setTimeout(function(){ tampil(ke + 1); }, lama());
      }

      el._lihat = function(v){
        terlihat = v;
        el.classList.toggle('jalan', v);
        var vid = lapis[ke] && lapis[ke].querySelector('video');
        if (vid){ v ? vid.play().catch(function(){}) : vid.pause(); }
        jadwal();
      };
      el._jeda = function(){ clearTimeout(jam); var vid = lapis[ke] && lapis[ke].querySelector('video'); if (vid) vid.pause(); };
      titik.forEach(function(t){ t.addEventListener('click', function(){ tampil(Number(t.dataset.ke)); }); });
      el.querySelectorAll('[data-geser]').forEach(function(t){
        t.addEventListener('click', function(){ tampil(ke + Number(t.dataset.geser)); });
      });
      /* Usap mendatar di mana saja pada bab = geser. Usap tegak tetap
         menggulir halaman: hanya gerak yang jelas mendatar yang dihitung. */
      if (lapis.length > 1){
        var x0 = null, y0 = 0;
        el.addEventListener('touchstart', function(e){ x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
        el.addEventListener('touchend', function(e){
          if (x0 === null) return;
          var dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
          if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) tampil(ke + (dx < 0 ? 1 : -1));
        }, { passive: true });
      }
    });

    if (!('IntersectionObserver' in window)){
      bab.forEach(function(el){ el._lihat(true); });
      return;
    }
    var pengamat = new IntersectionObserver(function(masuk){
      masuk.forEach(function(x){ x.target._lihat(x.isIntersecting); });
    }, { threshold: 0.2 });
    bab.forEach(function(el){ pengamat.observe(el); });

    document.addEventListener('visibilitychange', function(){
      bab.forEach(function(el){ document.hidden ? el._jeda() : el._lihat(el.classList.contains('jalan')); });
    });
  }

  /* ============================================================
     Penampil: semua foto/video satu bab, bisa digeser
     ============================================================ */
  var kaca = $('kaca'), daftarKaca = [], iKaca = 0, pemanggil = null;

  function gambarKaca(){
    var f = daftarKaca[iKaca];
    $('kacaIsi').innerHTML = f.jenis === 'video'
      ? '<video controls autoplay playsinline src="' + esc(url(f.jalur)) + '"' + (f.kecil ? ' poster="' + esc(url(f.kecil)) + '"' : '') + '></video>'
      : '<img src="' + esc(url(f.jalur)) + '" alt="' + esc(f.keterangan || '') + '">';
    $('kacaKet').textContent = f.keterangan || '';
    $('kacaHitung').textContent = daftarKaca.length > 1 ? (iKaca + 1) + ' / ' + daftarKaca.length : '';
    $('kacaKiri').hidden = $('kacaKanan').hidden = daftarKaca.length < 2;
  }
  function bukaKaca(kunci, i){
    daftarKaca = mediaBab[kunci] || [];
    if (!daftarKaca.length) return;
    iKaca = i || 0;
    pemanggil = document.activeElement;
    if (window.Motion) Motion.gulir.henti();
    gambarKaca();
    kaca.hidden = false;
    document.body.style.overflow = 'hidden';
    $('kacaTutup').focus();
  }
  function tutupKaca(){
    kaca.hidden = true;
    $('kacaIsi').innerHTML = '';
    document.body.style.overflow = '';
    if (pemanggil && pemanggil.focus) pemanggil.focus();
  }
  function geser(n){ iKaca = (iKaca + n + daftarKaca.length) % daftarKaca.length; gambarKaca(); }

  document.addEventListener('click', function(e){
    var t = e.target.closest('[data-lihat]');
    if (t) bukaKaca(t.dataset.lihat, Number(t.dataset.i || 0));
  });
  $('kacaTutup').addEventListener('click', tutupKaca);
  $('kacaKiri').addEventListener('click', function(){ geser(-1); });
  $('kacaKanan').addEventListener('click', function(){ geser(1); });
  kaca.addEventListener('click', function(e){ if (e.target === kaca || e.target.id === 'kacaIsi') tutupKaca(); });
  document.addEventListener('keydown', function(e){
    if (kaca.hidden) return;
    if (e.key === 'Escape') tutupKaca();
    if (e.key === 'ArrowLeft') geser(-1);
    if (e.key === 'ArrowRight') geser(1);
  });
  var sentuhX = null;
  kaca.addEventListener('touchstart', function(e){ sentuhX = e.touches[0].clientX; }, { passive: true });
  kaca.addEventListener('touchend', function(e){
    if (sentuhX === null) return;
    var dx = e.changedTouches[0].clientX - sentuhX; sentuhX = null;
    if (Math.abs(dx) > 50 && daftarKaca.length > 1) geser(dx < 0 ? 1 : -1);
  });

  /* ============================================================
     Ucapan tamu: muncul satu per satu, berurutan dari yang pertama
     masuk, berputar selama halaman dibuka.
     ============================================================ */
  var LAMA_UCAP = 7000, JEDA_UCAP = 1600, KUNCI_UCAP = 'kenangan-ucapan';
  /* Tamu bisa menyembunyikan ucapan lewat tombol gelembung (atau ×) dan
     menyalakannya lagi; pilihannya diingat di peramban ini. Bawaan:
     tampil. */
  function putarUcapan(daftar){
    if (!daftar.length) return;
    var wadah = $('ucapan'), btn = $('btnUcapan'), i = 0, jam = null, nyala = false, kiri = true;
    var lebar = matchMedia('(min-width: 900px)');

    function ingat(v){ try { v ? localStorage.removeItem(KUNCI_UCAP) : localStorage.setItem(KUNCI_UCAP, 'mati'); } catch (e) {} }
    function tersimpanMati(){ try { return localStorage.getItem(KUNCI_UCAP) === 'mati'; } catch (e) { return false; } }

    function satu(){
      if (!nyala) return;
      if (document.hidden){ jam = setTimeout(satu, 2000); return; }
      var u = daftar[i % daftar.length]; i++;
      wadah.classList.toggle('kanan', lebar.matches && !kiri);
      kiri = !kiri;
      wadah.innerHTML = '<div class="ucap">'
        + '<div class="siapa"><span class="nama">' + esc(u.nama) + '</span>'
        + (u.hadir === 'Hadir' ? '<span class="hadir">hadir</span>' : '') + '</div>'
        + '<p class="pesan">' + esc(u.pesan) + '</p>'
        + '<button class="tutup" type="button" aria-label="Sembunyikan ucapan">&times;</button></div>';
      var el = wadah.firstChild;
      el.querySelector('.tutup').addEventListener('click', function(){ ingat(false); atur(false); });
      requestAnimationFrame(function(){ requestAnimationFrame(function(){ el.classList.add('in'); }); });
      jam = setTimeout(function(){
        el.classList.remove('in');
        jam = setTimeout(satu, kurangi ? JEDA_UCAP : 600 + JEDA_UCAP);
      }, LAMA_UCAP);
    }
    function atur(v, jeda){
      nyala = v;
      clearTimeout(jam);
      btn.setAttribute('aria-pressed', v ? 'true' : 'false');
      btn.setAttribute('aria-label', v ? 'Sembunyikan ucapan tamu' : 'Tampilkan ucapan tamu');
      if (v) jam = setTimeout(satu, jeda == null ? 400 : jeda);
      else wadah.innerHTML = '';
    }
    btn.classList.add('show');
    btn.addEventListener('click', function(){ var v = !nyala; ingat(v); atur(v); });
    atur(!tersimpanMati(), 2500);
  }

  /* ============================================================
     Musik dan gulir otomatis — sama seperti undangan
     ============================================================ */
  var Musik = (function(){
    var btn = $('btnMusik'), audio = null, aktif = false;
    function pudar(ke){
      var langkah = (ke - audio.volume) / 30, n = 0;
      var t = setInterval(function(){
        audio.volume = Math.min(1, Math.max(0, audio.volume + langkah));
        if (++n >= 30){ clearInterval(t); audio.volume = ke; if (ke === 0) audio.pause(); }
      }, 40);
    }
    function nyala(){
      if (!M.BACKSOUND_URL) return;
      if (!audio){ audio = new Audio(M.BACKSOUND_URL); audio.loop = true; audio.volume = 0; }
      audio.play().then(function(){ pudar(0.42); }).catch(function(){});
      aktif = true; btn.classList.add('on'); btn.classList.remove('off');
      btn.setAttribute('aria-label', 'Matikan musik latar');
    }
    function padam(){
      if (audio) pudar(0);
      aktif = false; btn.classList.remove('on'); btn.classList.add('off');
      btn.setAttribute('aria-label', 'Nyalakan musik latar');
    }
    btn.addEventListener('click', function(){ aktif ? padam() : nyala(); });
    document.addEventListener('visibilitychange', function(){ if (document.hidden && aktif) padam(); });
    return {
      tampilkan: function(){ if (M.BACKSOUND_URL) btn.classList.add('show'); },
      mulai: nyala
    };
  })();

  function siapkanGulir(){
    var btn = $('btnGulir');
    if (!window.Motion) return false;
    var bisa = Motion.gulir.pasang({
      kabar: function(jalan){
        btn.setAttribute('aria-pressed', jalan ? 'true' : 'false');
        btn.setAttribute('aria-label', jalan ? 'Hentikan gulir otomatis' : 'Gulir otomatis');
      }
    });
    if (!bisa) return false;
    btn.addEventListener('click', function(){ Motion.gulir.alih(); });
    btn.addEventListener('pointerdown', function(e){ e.stopPropagation(); });
    btn.addEventListener('keydown', function(e){ e.stopPropagation(); });
    btn.classList.add('show');
    return true;
  }

  /* Tombol musik dan gulir tampil sejak halaman siap; "Putar kenangan"
     di sampul menyalakan keduanya sekaligus dengan satu sentuhan. */
  function pasangPutar(){
    var tombol = $('btnPutar');
    var gulir = siapkanGulir();
    Musik.tampilkan();
    tombol.hidden = false;
    tombol.addEventListener('pointerdown', function(e){ e.stopPropagation(); });
    tombol.addEventListener('click', function(){
      Musik.mulai();
      tombol.hidden = true;
      var awal = document.querySelector('#cerita > :first-child');
      if (awal) awal.scrollIntoView({ behavior: kurangi ? 'auto' : 'smooth' });
      if (gulir) setTimeout(function(){ Motion.gulir.mulai(); }, kurangi ? 0 : 1400);
    });
  }

  /* ============================================================
     Reveal
     ============================================================ */
  function hidupkanReveal(){
    var item = document.querySelectorAll('.reveal');
    if (kurangi || !('IntersectionObserver' in window)){
      item.forEach(function(el){ el.classList.add('in'); });
      return;
    }
    var p = new IntersectionObserver(function(masuk){
      masuk.forEach(function(x){ if (x.isIntersecting){ x.target.classList.add('in'); p.unobserve(x.target); } });
    }, { rootMargin: '0px 0px -8% 0px', threshold: 0.06 });
    item.forEach(function(el){ p.observe(el); });
  }

  /* ============================================================
     Muat — pintu tamu atau pratinjau pemilik
     ============================================================ */
  function belumAda(pesan, html){
    if (html) $('sampulKalimat').innerHTML = html; else $('sampulKalimat').textContent = pesan;
    hidupkanReveal();
    document.body.dataset.siap = 'kosong';
  }

  var pratinjau = new URLSearchParams(location.search).get('pratinjau') === '1';
  function sesiDasbor(){
    try { var s = JSON.parse(localStorage.getItem('dasbor-sesi') || 'null'); return s && s.akses ? s : null; }
    catch (e) { return null; }
  }
  function pasangPita(d){
    var pita = $('pita');
    if (!d.undangan_terbit)      pita.innerHTML = '<b>Pratinjau</b> Undangan masih draf — tamu belum bisa membuka halaman ini.';
    else if (!d.kenangan_terbit) pita.innerHTML = '<b>Pratinjau</b> Belum diterbitkan — tamu belum melihat halaman ini.';
    else { pita.innerHTML = '<b>Pratinjau</b> Sudah terbit — beginilah yang dilihat tamu.'; pita.className = 'terbit'; }
    pita.hidden = false;
    document.title = 'Pratinjau · ' + document.title;
  }
  function minta(){
    if (!pratinjau){
      return fetch(M.SB.url + '/rest/v1/rpc/terimakasih_isi', {
        method: 'POST',
        headers: { apikey: M.SB.key, Authorization: 'Bearer ' + M.SB.key, 'Content-Type': 'application/json' },
        body: JSON.stringify({ p_slug: M.slugPasangan() })
      }).then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
    }
    var sesi = sesiDasbor();
    if (!sesi) return Promise.reject({ pesan: 'masuk' });
    return fetch(M.SB.url + '/rest/v1/rpc/terimakasih_pratinjau', {
      method: 'POST',
      headers: { apikey: M.SB.key, Authorization: 'Bearer ' + sesi.akses, 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_slug: M.slugPasangan() })
    }).then(function(r){
      if (r.status === 401) throw { pesan: 'habis' };
      if (r.status === 403) throw { pesan: 'bukan' };
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }
  var KABAR_PRATINJAU = {
    masuk: 'Pratinjau hanya bisa dibuka dari dasbor. <a href="/dasbor">Masuk ke dasbor</a>, lalu tekan Pratinjau.',
    habis: 'Sesi dasbor sudah habis. <a href="/dasbor">Masuk lagi</a>, lalu tekan Pratinjau.',
    bukan: 'Akun yang sedang masuk bukan pemilik undangan ini.'
  };

  /* Tema undangan pasangan, berkas kenangan.css-nya (migrasi 036):
     halaman terima kasih mengikuti template undangannya. Ditunggu dulu
     supaya bab-babnya tidak sempat tergambar dengan tema bawaan. */
  function pasangTema(d){
    return M.pasangTema(d.tema, d.tema_setel, 'kenangan.css').then(null, function(){})
      .then(function(){ return d; });
  }

  minta()
  .then(function(d){
    if (!d || d.aktif !== true) return d;
    return pasangTema(d);
  })
  .then(function(d){
    if (!d || d.aktif !== true){ belumAda('Halaman ini belum tersedia.'); return; }
    if (d.pratinjau) pasangPita(d);
    bangun(d);
    /* ornamen yang baru digambar bangun() ikut ornamen temanya */
    M.tema.pasangOrnamen();
    M.tema.jalankanTata(document);
    pasangGiliran();
    aturTengah();
    addEventListener('resize', aturTengah);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(aturTengah);
    hidupkanReveal();
    pasangPutar();
    if (K.berlaku(d.blok, 'ucapan').tampil){
      // dari server terbaru dulu; ditampilkan dari yang pertama masuk
      putarUcapan((d.ucapan || []).slice().reverse());
    }
    document.body.dataset.siap = 'isi';
  })
  .catch(function(e){
    if (e && KABAR_PRATINJAU[e.pesan]){ belumAda('', KABAR_PRATINJAU[e.pesan]); return; }
    belumAda('Belum bisa dimuat. Coba muat ulang halaman.');
  });
})();
</script>
