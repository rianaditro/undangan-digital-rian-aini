<!--
  Halaman kenangan, versi 2 (revisi 10 Oktober — migrasi 033).
  Rancangan: docs/kenangan.md. Susunan bab: assets/kenangan.js.

  Surat dari pengantin untuk yang hadir. Gulir = hari itu berjalan:
  sampul, pesan dari kami, mempelai pria, mempelai wanita, kedatangan
  keluarga, babak acara (akad, resepsi, …), sungkem, keluarga, para
  tamu, kami berdua, album, terima kasih kepada, penutup.

  Tiap bab berlatar foto/video yang bergiliran pelan, dengan tombol
  ‹ › dan usap mendatar untuk menggeser; potongannya (titik fokus +
  perbesaran, 034) diatur di dasbor untuk layar HP. Melihat satu per
  satu dan memperbesar ada di album paling bawah, yang memuat SEMUA
  foto. Ucapan tamu muncul kecil dan tembus pandang di pojok bawah;
  tamu bisa menyembunyikannya lewat tombol gelembung. Musik dan gulir otomatis menyala lewat
  tombol "Putar kenangan" di sampul — peramban tidak mengizinkan suara
  tanpa sentuhan tamu.

  Tidak pernah kosong: bab media tanpa foto tidak muncul kecuali
  pasangan menulis sesuatu untuknya; babak acara tanpa foto jadi kartu
  teks; sampul tanpa foto tetap nama, tanggal, dan kalimatnya.
-->

<style>
:root{
  --nila:#131E33; --nila-2:#1B2A46; --nila-3:#0D1626;
  --jati:#4A3323; --kuningan:#C39A5C; --kuningan-dim:#8C6A3A;
  --kapur:#EDE7D9; --kapur-2:#E2DAC7; --daun:#7C8B63;
  --display:'Marcellus','Times New Roman',serif;
  --script:'Cormorant',Georgia,serif;
  --body:'Karla','Helvetica Neue',Arial,sans-serif;
  --pad:clamp(22px,6vw,64px);
  --gulir-laju:42;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;}
body{
  font-family:var(--body);background:var(--nila);color:var(--kapur);
  line-height:1.7;font-weight:300;overflow-x:hidden;-webkit-font-smoothing:antialiased;
}
img,svg,video{display:block;max-width:100%;}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
a{color:inherit;}
[hidden]{display:none!important;}
:focus-visible{outline:2px solid var(--kuningan);outline-offset:3px;}

section{position:relative;}
.wrap{max-width:640px;margin:0 auto;}
.wrap-lebar{max-width:980px;margin:0 auto;}
.center{text-align:center;}

/* ---------- Tipografi ----------
   Tiga suara, masing-masing satu tugas:
     .eyebrow  — penunjuk bab, huruf kecil berjarak (Karla)
     .judul    — nama bab, tegak dan tenang (Marcellus)
     .kalimat  — yang ingin diucapkan pengantin, miring dan hangat
                 (Cormorant) — ini yang paling sering dibaca, jadi
                 paling besar di antara teks berjalan. */
.eyebrow{font-size:11px;letter-spacing:.34em;text-transform:uppercase;font-weight:500;color:var(--kuningan);}
.judul{font-family:var(--display);font-weight:400;font-size:clamp(28px,7.4vw,46px);letter-spacing:.04em;line-height:1.18;margin-top:12px;}
.kalimat{font-family:var(--script);font-style:italic;font-weight:400;font-size:clamp(19px,4.9vw,25px);line-height:1.62;margin-top:16px;white-space:pre-line;}
.keterangan{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(237,231,217,.66);margin-top:12px;}

.ukir{--ukir-garis:var(--kuningan);--ukir-isi:var(--kuningan);}
.kertas .ukir{--ukir-garis:var(--jati);--ukir-isi:var(--jati);}
.pemisah{width:min(220px,58vw);height:40px;margin:26px auto 0;opacity:.9;}

.reveal{opacity:0;transform:translateY(24px);}
.reveal.in{opacity:1;transform:none;transition:opacity 1s ease,transform 1s cubic-bezier(.22,.8,.3,1);}

/* ---------- Bab kertas (tulisan saja) ---------- */
.kertas{background:var(--kapur);color:var(--nila);padding:clamp(80px,18vw,140px) var(--pad);text-align:center;}
.kertas::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(94deg,transparent 0 3px,rgba(74,51,35,.028) 3px 4px);}
.kertas > *{position:relative;}
.kertas .eyebrow{color:var(--kuningan-dim);}
.kertas .kalimat{color:var(--jati);max-width:560px;margin-inline:auto;}

/* ---------- Latar bergilir ----------
   Satu bab = satu tumpukan lapis. Lapis aktif terlihat, lainnya pudar.
   Foto bergeser pelan (pan) hanya selama babnya terlihat dan lapisnya
   aktif; video diputar bisu hanya selama lapisnya aktif. Arah pan
   berselang per bab, supaya gulir tidak terasa satu gerakan diulang. */
.latar{position:absolute;inset:0;overflow:hidden;background:var(--nila-3);}
.lapis{position:absolute;inset:0;opacity:0;transition:opacity 1.6s ease;}
.lapis.aktif{opacity:1;}
/* Potongan dari dasbor (034): titik fokus jadi object-position DAN pusat
   perbesaran, jadi jendela tegak yang dipilih pasangan untuk layar HP
   tetap yang terlihat; di layar lebar titik yang sama jadi pusatnya. */
.lapis img,.lapis video{width:100%;height:100%;object-fit:cover;max-width:none;
  object-position:var(--fx,50%) var(--fy,50%);transform-origin:var(--fx,50%) var(--fy,50%);}
.lapis video{transform:scale(var(--z,1));}
.lapis img{transform:scale(calc(var(--z,1) * 1.08));animation:pan 26s ease-in-out infinite alternate;animation-play-state:paused;}
.jalan .lapis.aktif img{animation-play-state:running;}
.latar.balik .lapis img{animation-name:pan-balik;}
@keyframes pan{from{transform:scale(calc(var(--z,1) * 1.08)) translate3d(-1.2%,-.8%,0);}to{transform:scale(calc(var(--z,1) * 1.14)) translate3d(1.2%,.8%,0);}}
@keyframes pan-balik{from{transform:scale(calc(var(--z,1) * 1.14)) translate3d(1.2%,-.8%,0);}to{transform:scale(calc(var(--z,1) * 1.08)) translate3d(-1.2%,.8%,0);}}
.latar::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to top,rgba(9,14,24,.94) 0%,rgba(9,14,24,.6) 36%,rgba(9,14,24,.12) 70%,rgba(9,14,24,.32) 100%);}

/* ---------- Sampul ---------- */
#sampul{
  min-height:100svh;display:flex;flex-direction:column;justify-content:center;align-items:center;
  text-align:center;padding:clamp(70px,14vw,110px) var(--pad);overflow:hidden;
  background:radial-gradient(110% 70% at 50% 100%,#22355A 0%,var(--nila) 55%,var(--nila-3) 100%);
}
#sampul > :not(.latar){position:relative;}
#sampul .latar::after{background:radial-gradient(95% 75% at 50% 52%,rgba(9,14,24,.5) 0%,rgba(9,14,24,.84) 100%);}
.nama-besar{font-family:var(--display);font-size:clamp(36px,11vw,72px);letter-spacing:.04em;line-height:1.12;margin-top:18px;}
.nama-amp{font-family:var(--script);font-style:italic;font-weight:300;color:var(--kuningan);}
.tanggal{margin-top:18px;font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--kuningan);}
#sampulKalimat{max-width:520px;margin-inline:auto;margin-top:26px;}
.tombol-putar{
  margin-top:38px;display:inline-flex;align-items:center;gap:12px;
  border:1px solid rgba(195,154,92,.7);border-radius:999px;padding:13px 26px 13px 18px;
  font-size:11px;letter-spacing:.24em;text-transform:uppercase;font-weight:500;color:var(--kapur);
  background:rgba(13,22,38,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  transition:background .3s,border-color .3s;
}
.tombol-putar:hover{background:rgba(195,154,92,.18);border-color:var(--kuningan);}
.tombol-putar svg{width:22px;height:22px;}
.tombol-putar path{fill:var(--kuningan);}
#sampul > .turun{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);
  font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:rgba(237,231,217,.55);}

/* ---------- Bab bergambar ---------- */
/* Di HP tulisan bab duduk di atas pojok bawah, tempat ucapan dan tombol
   musik/gulir mengambang; rata kanan hanya di layar lebar, supaya
   tulisan tidak masuk ke bawah tombol. */
.bab{min-height:100svh;display:flex;align-items:flex-end;padding:clamp(70px,14vw,110px) var(--pad) 150px;overflow:hidden;}
.bab .isi{position:relative;max-width:600px;}
/* Kolom tombol mengambang (ucapan, gulir, musik) di kanan bawah: tulisan
   bab di HP menyisakan jalurnya. */
@media (max-width:719px){ .bab .isi{padding-right:52px;} .bab.polos .isi{padding-right:0;} }
.bab .kalimat{color:var(--kapur);}
.bab .judul{text-shadow:0 2px 24px rgba(0,0,0,.35);}
.alat-bab{display:flex;align-items:center;gap:16px;margin-top:22px;flex-wrap:wrap;}
.titik{display:flex;gap:7px;align-items:center;}
.titik button{width:7px;height:7px;border-radius:50%;background:rgba(237,231,217,.35);padding:0;transition:background .3s,transform .3s;}
.titik button[aria-current="true"]{background:var(--kuningan);transform:scale(1.3);}
/* Tombol geser: cukup besar untuk jempol (44 px), tapi tipis supaya
   tidak menutupi foto. */
.geser{width:44px;height:44px;border-radius:50%;border:1px solid rgba(195,154,92,.55);
  background:rgba(13,22,38,.38);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  display:grid;place-items:center;font-size:22px;line-height:1;color:var(--kapur);transition:background .25s,border-color .25s;}
.geser:hover{background:rgba(195,154,92,.22);border-color:var(--kuningan);}
.alat-bab{gap:14px;}

/* bab tanpa foto: kartu teks di atas nila */
.bab.polos{min-height:auto;align-items:center;justify-content:center;text-align:center;
  background:radial-gradient(90% 80% at 50% 0%,var(--nila-2) 0%,var(--nila) 60%,var(--nila-3) 100%);
  border-top:1px solid rgba(195,154,92,.12);padding:clamp(84px,18vw,130px) var(--pad);}
.bab.polos .isi{margin:0 auto;}

/* ---------- Album ---------- */
.album{columns:2;column-gap:12px;margin-top:38px;}
@media (min-width:720px){ .album{columns:3;column-gap:16px;} }
.album button{display:block;width:100%;margin:0 0 12px;break-inside:avoid;border-radius:2px;overflow:hidden;position:relative;background:var(--kapur-2);}
.album img{width:100%;height:auto;transition:transform .5s cubic-bezier(.22,.8,.3,1);}
.album button:hover img{transform:scale(1.04);}
.tanda-video{position:absolute;right:8px;bottom:8px;width:30px;height:30px;border-radius:50%;
  background:rgba(13,22,38,.7);display:grid;place-items:center;}
.tanda-video svg{width:14px;height:14px;}
.tanda-video path{fill:var(--kapur);}

/* ---------- Terima kasih kepada ---------- */
#vendor{background:var(--nila-2);padding:clamp(80px,17vw,130px) var(--pad);text-align:center;border-top:1px solid rgba(195,154,92,.14);}
#vendor .kalimat{color:rgba(237,231,217,.86);max-width:540px;margin-inline:auto;}
.vendor{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:28px 24px;margin-top:46px;text-align:center;}
.vendor div{padding-top:16px;border-top:1px solid rgba(195,154,92,.28);}
.vendor .peran{font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--kuningan);}
.vendor .nama{font-family:var(--display);font-size:19px;letter-spacing:.03em;margin-top:6px;}
.vendor a{display:inline-block;margin-top:4px;font-size:13px;color:rgba(237,231,217,.7);text-decoration:none;border-bottom:1px solid rgba(237,231,217,.25);}

/* ---------- Penutup ---------- */
.tanda-tangan{margin-top:34px;}
.tanda-tangan .oleh{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--kuningan-dim);}
.tanda-tangan .nama{font-family:var(--script);font-style:italic;font-size:clamp(30px,8vw,44px);color:var(--jati);margin-top:8px;line-height:1.2;}
.kaki{padding:clamp(44px,10vw,64px) var(--pad) 120px;text-align:center;border-top:1px solid rgba(195,154,92,.16);}
.kaki a{color:var(--kuningan);text-decoration:none;border-bottom:1px solid rgba(195,154,92,.4);}

/* ---------- Ucapan yang muncul bergantian ----------
   Pojok kiri dan kanan bawah bergantian di layar lebar; di HP satu
   tempat di kiri bawah, menyisakan ruang untuk tombol musik/gulir. */
/* Kecil dan tembus pandang: ucapan menemani foto, bukan menutupinya. */
#ucapan{position:fixed;bottom:max(16px,env(safe-area-inset-bottom));left:clamp(10px,3vw,24px);
  width:min(260px,calc(100vw - 88px));z-index:40;pointer-events:none;}
#ucapan.kanan{left:auto;right:clamp(78px,8vw,100px);}
.ucap{pointer-events:auto;position:relative;background:rgba(13,22,38,.46);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
  border:1px solid rgba(195,154,92,.2);border-radius:4px;padding:9px 28px 9px 12px;
  opacity:0;transform:translateY(10px);transition:opacity .6s ease,transform .6s cubic-bezier(.22,.8,.3,1);}
.ucap.in{opacity:.88;transform:none;}
.ucap .siapa{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;}
.ucap .nama{font-family:var(--display);font-size:12.5px;letter-spacing:.02em;color:rgba(237,231,217,.92);}
.ucap .hadir{font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--daun);}
.ucap .pesan{margin-top:3px;font-family:var(--script);font-style:italic;font-size:14px;line-height:1.4;color:rgba(237,231,217,.8);
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;}
.ucap .tutup{position:absolute;top:2px;right:2px;width:26px;height:26px;font-size:15px;line-height:1;color:rgba(237,231,217,.45);}

/* ---------- Tombol musik dan gulir (sama dengan undangan) ---------- */
#btnMusik,#btnGulir,#btnUcapan{
  position:fixed;right:clamp(14px,4vw,26px);z-index:50;width:48px;height:48px;border-radius:50%;
  background:var(--nila-3);border:1px solid rgba(195,154,92,.55);display:none;align-items:center;justify-content:center;
  box-shadow:0 8px 24px -8px rgba(0,0,0,.6);transition:transform .3s,border-color .3s;
}
#btnMusik{bottom:clamp(14px,4vw,26px);}
#btnGulir{bottom:calc(clamp(14px,4vw,26px) + 58px);}
#btnUcapan{bottom:calc(clamp(14px,4vw,26px) + 116px);}
#btnMusik.show,#btnGulir.show,#btnUcapan.show{display:flex;}
#btnMusik:hover,#btnGulir:hover,#btnUcapan:hover{transform:scale(1.06);border-color:var(--kuningan);}
#btnUcapan svg{width:22px;height:22px;}
#btnUcapan path{fill:none;stroke:var(--kuningan);stroke-width:1.5;stroke-linejoin:round;}
#btnUcapan .bar{stroke:var(--kuningan);stroke-width:1.6;stroke-linecap:round;opacity:0;transition:opacity .3s;}
#btnUcapan[aria-pressed="false"] .bar{opacity:1;}
#btnUcapan[aria-pressed="false"] path{opacity:.55;}
#btnMusik svg{width:26px;height:26px;}
#btnMusik .disc{stroke:var(--kuningan);fill:none;stroke-width:1.2;}
#btnMusik .pin{fill:var(--kuningan);}
#btnMusik .spin{transform-origin:50% 50%;animation:putar 9s linear infinite;animation-play-state:paused;}
#btnMusik.on .spin{animation-play-state:running;}
#btnMusik .bar{stroke:var(--kuningan);stroke-width:1.6;stroke-linecap:round;opacity:0;transition:opacity .3s;}
#btnMusik.off .bar{opacity:1;}
@keyframes putar{to{transform:rotate(360deg);}}
#btnGulir svg{width:24px;height:24px;}
#btnGulir path,#btnGulir rect{fill:var(--kuningan);}
#btnGulir .ikon-jeda{display:none;}
#btnGulir[aria-pressed="true"] .ikon-main{display:none;}
#btnGulir[aria-pressed="true"] .ikon-jeda{display:block;}

/* ---------- Penampil (lightbox) ---------- */
#kaca{position:fixed;inset:0;z-index:70;background:rgba(9,14,24,.96);display:flex;align-items:center;justify-content:center;}
#kacaIsi{max-width:100%;max-height:100%;padding:clamp(48px,8vw,70px) clamp(8px,6vw,80px);display:flex;align-items:center;justify-content:center;width:100%;height:100%;}
#kacaIsi img,#kacaIsi video{max-width:100%;max-height:80svh;width:auto;object-fit:contain;}
#kaca .ket{position:absolute;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));text-align:center;font-size:13px;color:rgba(237,231,217,.8);padding:0 60px;}
#kacaHitung{position:absolute;top:max(18px,env(safe-area-inset-top));left:20px;font-size:11px;letter-spacing:.2em;color:rgba(237,231,217,.6);}
#kacaTutup{position:absolute;top:max(8px,env(safe-area-inset-top));right:10px;width:44px;height:44px;font-size:28px;line-height:1;}
.kaca-geser{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;font-size:30px;color:rgba(237,231,217,.8);}
#kacaKiri{left:4px;} #kacaKanan{right:4px;}

/* ---------- Pita pratinjau ---------- */
#pita{position:sticky;top:0;z-index:60;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;
  padding:9px 16px;font-size:12px;letter-spacing:.04em;text-align:center;background:var(--kuningan);color:var(--nila-3);}
#pita b{font-weight:700;letter-spacing:.18em;text-transform:uppercase;font-size:10.5px;}
#pita.terbit{background:var(--daun);color:var(--kapur);}
#pita a{color:inherit;}

@media (min-width:720px){
  .bab{padding-bottom:clamp(80px,10vw,120px);}
  .bab.kanan{justify-content:flex-end;text-align:right;}
  .bab.kanan .isi{margin-left:auto;}
  .bab.kanan .alat-bab{justify-content:flex-end;}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto;}
  .reveal,.reveal.in{opacity:1;transform:none;transition:none;}
  .lapis{transition:none;}
  .lapis img,.latar.balik .lapis img{animation:none;transform:scale(var(--z,1));}
  #btnMusik .spin{animation:none;}
  .ucap{transition:none;}

}
/* ---------- Tampil utuh (035) ----------
   Foto landscape di layar tegak: fotonya utuh selebar layar, di tengah
   ruang kosong di atas tulisan bab (--tengah, dihitung aturTengah());
   sisa layar diisi foto yang sama, buram dan gelap. Hanya untuk layar
   tegak — di layar mendatar foto landscape memang pas sebagai latar. */
.lapis .buram{display:none;}
@media (orientation:portrait){
  .latar .lapis.utuh .buram{display:block;position:absolute;inset:-6%;width:112%;height:112%;max-width:none;
    object-fit:cover;filter:blur(26px) brightness(.42) saturate(1.15);transform:none;animation:none;}
  .latar .lapis.utuh .utama{position:absolute;left:0;right:0;width:100%;height:auto;max-height:52%;
    top:max(var(--tengah,40%), calc(min(26%, 34vw) + 10px));
    object-fit:contain;transform:translateY(-50%);animation:none;box-shadow:0 18px 40px -18px rgba(0,0,0,.8);}
}

</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <g id="ukir-pemisah">
    <path style="fill:none;stroke:var(--ukir-garis);stroke-width:1.1;stroke-linecap:round;vector-effect:non-scaling-stroke" d="M4 20 C40 20 56 8 74 8 C88 8 96 14 104 20"/>
    <path style="fill:none;stroke:var(--ukir-garis);stroke-width:1.1;stroke-linecap:round;vector-effect:non-scaling-stroke" d="M4 20 C40 20 56 32 74 32 C88 32 96 26 104 20"/>
    <path style="fill:none;stroke:var(--ukir-garis);stroke-width:1.1;stroke-linecap:round;vector-effect:non-scaling-stroke" d="M236 20 C200 20 184 8 166 8 C152 8 144 14 136 20"/>
    <path style="fill:none;stroke:var(--ukir-garis);stroke-width:1.1;stroke-linecap:round;vector-effect:non-scaling-stroke" d="M236 20 C200 20 184 32 166 32 C152 32 144 26 136 20"/>
    <path style="fill:none;stroke:var(--ukir-garis);stroke-width:1.1;stroke-linecap:round;vector-effect:non-scaling-stroke" d="M120 10 L130 20 L120 30 L110 20 Z"/>
    <path style="fill:var(--ukir-isi);opacity:.85" d="M74 8 c6 -8 16 -8 21 -1 c-7 6 -16 6 -21 1z"/>
    <path style="fill:var(--ukir-isi);opacity:.85" d="M166 32 c-6 8 -16 8 -21 1 c7 -6 16 -6 21 -1z"/>
  </g>
  <path id="ikon-main" d="M13 10.5 L22 16 L13 21.5 Z"/>
</defs></svg>

<div id="pita" hidden role="status"></div>

<section id="sampul">
  <p class="eyebrow reveal" id="sampulJudul">Terima Kasih</p>
  <h1 class="nama-besar reveal" id="namaBesar">&nbsp;</h1>

<script src="/assets/varian.js"></script>
<script src="/assets/gambar.js"></script>
<script src="/assets/kenangan.js"></script>
<script src="/assets/motion.js"></script>
<script>
(function(){
  'use strict';
  var M = window.MENGUNDANG, K = window.Kenangan;
  var $ = function(id){ return document.getElementById(id); };
  var kurangi = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  var url = function(j){ return window.Gambar.url(j); };

  var BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli',
               'Agustus','September','Oktober','November','Desember'];
  function tanggalPanjang(iso){
    if (!iso) return '';
    var p = String(iso).slice(0,10).split('-');
    if (p.length !== 3) return '';
    return Number(p[2]) + ' ' + BULAN[Number(p[1]) - 1] + ' ' + p[0];
  }
  function judulKata(s){
    // huruf pertama tiap kata, melompati tanda baca di depannya:
    // 'AINI → 'Aini, MA'RUF → Ma'ruf
    return String(s || '').toLowerCase().replace(/(^|[\s-])([^a-z\s]*)([a-z])/g, function(m, a, b, c){ return a + b + c.toUpperCase(); });
  }

  /* ============================================================
     Media sebuah bab
     ============================================================ */
  var GILIR_FOTO = 6500;

  function angkaPotong(n, bawaan, lo, hi){
    n = Number(n);
    return isFinite(n) && n >= lo && n <= hi ? n : bawaan;
  }
  function potongan(f){
    return ' style="--fx:' + angkaPotong(f.fokus_x, 50, 0, 100) + '%;--fy:' + angkaPotong(f.fokus_y, 50, 0, 100)
      + '%;--z:' + angkaPotong(f.zum, 1, 1, 3) + '"';
  }
  /* Mode tampil per foto (035): pilihan pasangan, atau otomatis dari
     ukurannya — landscape tampil utuh, selain itu isi layar. */
  function modeTampil(f){
    if (f.tampilan === 'isi' || f.tampilan === 'utuh') return f.tampilan;
    return (f.lebar && f.tinggi && f.lebar > f.tinggi * 1.15) ? 'utuh' : 'isi';
  }
  function lapisHtml(f, i){
    var aktif = i === 0 ? ' aktif' : '';
    var utuh = modeTampil(f) === 'utuh';
    var malas = i === 0 ? '' : ' loading="lazy"';
    // latar buram: berkas yang sama (dari cache), atau poster untuk video
    var buram = utuh ? '<img class="buram" src="' + esc(url(f.jenis === 'video' ? (f.kecil || f.jalur) : f.jalur)) + '" alt=""' + malas + ' decoding="async">' : '';
    var kelas = 'lapis' + aktif + (utuh ? ' utuh' : '');
    if (f.jenis === 'video'){
      return '<div class="' + kelas + '" data-durasi="' + (f.durasi_ms || 0) + '"' + potongan(f) + '>' + buram
        + '<video class="utama" muted loop playsinline preload="' + (i === 0 ? 'metadata' : 'none') + '"'
        + (f.kecil ? ' poster="' + esc(url(f.kecil)) + '"' : '') + ' src="' + esc(url(f.jalur)) + '"></video></div>';
    }
    return '<div class="' + kelas + '"' + potongan(f) + '>' + buram + '<img class="utama" src="' + esc(url(f.jalur)) + '" alt=""'
      + malas + ' decoding="async"></div>';
  }

  /* Pusat foto "tampil utuh" = tengah ruang kosong di atas tulisan bab.
     Dihitung ulang kalau ukuran layar berubah (HP diputar, bilah alamat
     menyusut) dan sesudah huruf termuat. */
  function aturTengah(){
    document.querySelectorAll('.lapis.utuh').forEach(function(l){
      var bab = l.closest('section'); if (!bab || bab._tengahDiatur) return;
      bab._tengahDiatur = true;
      var isi = Array.prototype.slice.call(bab.children).filter(function(c){ return !c.classList.contains('latar'); })[0];
      if (!isi) return;
      var ruang = isi.getBoundingClientRect().top - bab.getBoundingClientRect().top;
      if (ruang > 120) bab.style.setProperty('--tengah', Math.round(ruang / 2) + 'px');
    });
    document.querySelectorAll('section').forEach(function(b){ b._tengahDiatur = false; });
  }

  function latarHtml(media, balik){
    return '<div class="latar' + (balik ? ' balik' : '') + '" aria-hidden="true">'
      + media.slice(0, 8).map(lapisHtml).join('') + '</div>';
  }

  /* Tombol geser hanya untuk bab yang punya lebih dari satu berkas.
     Melihat satu per satu dan memperbesar ada di album paling bawah. */
  function alatBabHtml(media){
    var n = Math.min(media.length, 8);
    if (n < 2) return '';
    return '<div class="alat-bab">'
      + '<button type="button" class="geser" data-geser="-1" aria-label="Foto sebelumnya">&#8249;</button>'
      + '<div class="titik">' + media.slice(0, 8).map(function(_, i){
          return '<button type="button" data-ke="' + i + '" aria-label="Foto ' + (i+1) + '"'
            + (i === 0 ? ' aria-current="true"' : '') + '></button>';
        }).join('') + '</div>'
      + '<button type="button" class="geser" data-geser="1" aria-label="Foto berikutnya">&#8250;</button>'
      + '</div>';
  }

  /* ============================================================
     Menyusun bab
     ============================================================ */
  var mediaBab = {};       // galeri → daftar media, untuk penampil

  function bangun(d){
    var foto = d.foto || [];
    var menurutBagian = {}, menurutAcara = {}, lepas = [];
    foto.forEach(function(f){
      if (f.bagian) (menurutBagian[f.bagian] = menurutBagian[f.bagian] || []).push(f);
      else if (f.acara_id) (menurutAcara[f.acara_id] = menurutAcara[f.acara_id] || []).push(f);
      else lepas.push(f);
    });

    var pria   = (d.mempelai && d.mempelai.pria)   || {};
    var wanita = (d.mempelai && d.mempelai.wanita) || {};
    var namaPria = judulKata(pria.panggilan), namaWanita = judulKata(wanita.panggilan);
    var blok = function(k){ return K.berlaku(d.blok, k); };

    /* ---- sampul ---- */
    if (namaPria || namaWanita){
      $('namaBesar').innerHTML = esc(namaPria) + ' <span class="nama-amp">&amp;</span> ' + esc(namaWanita);
      document.title = 'Terima Kasih — ' + namaPria + ' & ' + namaWanita;
    }
    $('tanggal').textContent = [tanggalPanjang(d.tanggal_acara), judulKata(d.kota)].filter(Boolean).join(' · ');
    var bs = blok('sampul');
    $('sampulJudul').textContent = bs.judul;
    $('sampulKalimat').textContent = bs.teks || '';
    var mediaSampul = menurutBagian.sampul || [];
    if (mediaSampul.length){
      $('sampul').insertAdjacentHTML('afterbegin', latarHtml(mediaSampul, false));
      $('sampul').dataset.bab = 'sampul';
    }

    /* ---- album: SEMUA foto dan video, berurutan seperti bab-babnya;
       yang tanpa bab di akhir. Bab di atas bercerita, album tempat
       melihat satu per satu. ---- */
    var album = [], sudah = {};
    function masuk(daftar){ (daftar || []).forEach(function(f){ if (!sudah[f.jalur + '|' + (f.id || '')]){ sudah[f.jalur + '|' + (f.id || '')] = 1; album.push(f); } }); }
    K.BLOK.forEach(function(def){
      if (def.jenis === 'media') masuk(menurutBagian[def.kunci]);
      if (def.jenis === 'acara'){
        (d.babak || []).forEach(function(a){ masuk(menurutAcara[a.id]); });
        Object.keys(menurutAcara).forEach(function(id){ masuk(menurutAcara[id]); });   // acara yang tidak jadi babak
      }
    });
    masuk(lepas);

    /* ---- bab-bab ---- */
    var html = [], urutBerfoto = 0;

    function babMedia(kunci, eyebrow, judul, kalimat, ket, media){
      if (!media.length){
        return '<section class="bab polos" data-bab="' + esc(kunci) + '"><div class="isi wrap">'
          + (eyebrow ? '<p class="eyebrow reveal">' + esc(eyebrow) + '</p>' : '')
          + '<h2 class="judul reveal">' + esc(judul) + '</h2>'
          + (ket ? '<p class="keterangan reveal">' + esc(ket) + '</p>' : '')
          + (kalimat ? '<p class="kalimat reveal">' + esc(kalimat) + '</p>' : '')
          + '<svg class="ukir pemisah reveal" viewBox="0 0 240 40" aria-hidden="true"><use href="#ukir-pemisah"/></svg>'
          + '</div></section>';
      }
      urutBerfoto++;
      var kanan = urutBerfoto % 2 === 0;
      return '<section class="bab' + (kanan ? ' kanan' : '') + '" data-bab="' + esc(kunci) + '">'
        + latarHtml(media, kanan)
        + '<div class="isi">'
        +   (eyebrow ? '<p class="eyebrow reveal">' + esc(eyebrow) + '</p>' : '')
        +   '<h2 class="judul reveal">' + esc(judul) + '</h2>'
        +   (ket ? '<p class="keterangan reveal">' + esc(ket) + '</p>' : '')
        +   (kalimat ? '<p class="kalimat reveal">' + esc(kalimat) + '</p>' : '')
        +   '<div class="reveal">' + alatBabHtml(media) + '</div>'
        + '</div></section>';
    }

    function orangTua(m){
      var ortu = [m.ayah, m.ibu].filter(Boolean).join(' & ');
      return ortu ? ((m.anak || '') + ' ' + ortu).trim() : '';
    }

    K.BLOK.forEach(function(def){
      var b = blok(def.kunci);
      if (!b.tampil || def.kunci === 'sampul' || def.kunci === 'ucapan') return;

      if (def.jenis === 'teks' && def.kunci !== 'penutup'){
        html.push('<section class="kertas" data-bab="' + def.kunci + '"><div class="wrap">'
          + '<svg class="ukir pemisah reveal" viewBox="0 0 240 40" aria-hidden="true" style="margin-top:0"><use href="#ukir-pemisah"/></svg>'
          + '<h2 class="judul reveal">' + esc(b.judul) + '</h2>'
          + (b.teks ? '<p class="kalimat reveal">' + esc(b.teks) + '</p>' : '')
          + '</div></section>');
        return;
      }

      if (def.jenis === 'media'){
        var media = menurutBagian[def.kunci] || [];
        if (!media.length && !b.ditulis) return;
        if (def.kunci === 'pria' || def.kunci === 'wanita'){
          var m = def.kunci === 'pria' ? pria : wanita;
          html.push(babMedia(def.kunci, def.kunci === 'pria' ? 'Mempelai Pria' : 'Mempelai Wanita',
            b.judul || judulKata(m.panggilan) || def.nama, b.teks, orangTua(m) || judulKata(m.lengkap), media));
        } else {
          html.push(babMedia(def.kunci, null, b.judul || def.nama, b.teks, null, media));
        }
        return;
      }

      if (def.jenis === 'acara'){
        (d.babak || []).forEach(function(a){
          var waktu = [a.tanggal, a.jam].filter(Boolean).join(' · ');
          html.push(babMedia('acara-' + a.id, waktu || null, a.nama || 'Acara', a.teks || K.teksBabak(a.nama), null, menurutAcara[a.id] || []));
        });
        return;
      }

      if (def.jenis === 'album'){
        if (!album.length) return;
        mediaBab.galeri = album;
        html.push('<section class="kertas" data-bab="galeri"><div class="wrap-lebar">'
          + '<h2 class="judul reveal">' + esc(b.judul) + '</h2>'
          + (b.teks ? '<p class="kalimat reveal">' + esc(b.teks) + '</p>' : '')
          + '<div class="album">' + album.map(function(f, i){
              var rasio = (f.lebar && f.tinggi) ? ' style="aspect-ratio:' + f.lebar + '/' + f.tinggi + '"' : '';
              return '<button type="button" class="reveal" data-lihat="galeri" data-i="' + i + '" aria-label="Buka ' + (f.jenis === 'video' ? 'video' : 'foto') + ' ' + (i+1) + '">'
                + '<img src="' + esc(url(f.kecil || f.jalur)) + '" alt="' + esc(f.keterangan || '') + '" loading="lazy" decoding="async"' + rasio + '>'
                + (f.jenis === 'video' ? '<span class="tanda-video" aria-hidden="true"><svg viewBox="0 0 32 32"><use href="#ikon-main"/></svg></span>' : '')
                + '</button>';
            }).join('') + '</div></div></section>');
        return;
      }

      if (def.jenis === 'vendor'){
        var v = d.vendor || [];
        if (!v.length) return;
        html.push('<section id="vendor"><div class="wrap-lebar">'
          + '<h2 class="judul reveal">' + esc(b.judul) + '</h2>'
          + (b.teks ? '<p class="kalimat reveal">' + esc(b.teks) + '</p>' : '')
          + '<div class="vendor">' + v.map(function(x){
              var tautan = '';
              if (/^@/.test(x.tautan || '')) tautan = '<a href="https://instagram.com/' + esc(x.tautan.slice(1)) + '" target="_blank" rel="noopener">' + esc(x.tautan) + '</a>';
              else if (/^https?:\/\//.test(x.tautan || '')){
                var host = x.tautan.replace(/^https?:\/\/(www\.)?/, '').replace(/\/.*$/, '');
                tautan = '<a href="' + esc(x.tautan) + '" target="_blank" rel="noopener">' + esc(host) + '</a>';
              }
              return '<div class="reveal"><p class="peran">' + esc(x.peran) + '</p><p class="nama">' + esc(x.nama) + '</p>' + tautan + '</div>';
            }).join('') + '</div></div></section>');
        return;
      }

      if (def.kunci === 'penutup'){
        html.push('<section class="kertas" data-bab="penutup"><div class="wrap">'
          + '<h2 class="judul reveal">' + esc(b.judul) + '</h2>'
          + (b.teks ? '<p class="kalimat reveal">' + esc(b.teks) + '</p>' : '')
          + '<div class="tanda-tangan reveal"><p class="oleh">Kami yang berbahagia</p>'
          + '<p class="nama">' + esc(namaPria) + ' &amp; ' + esc(namaWanita) + '</p></div>'
          + '<svg class="ukir pemisah reveal" viewBox="0 0 240 40" aria-hidden="true"><use href="#ukir-pemisah"/></svg>'
          + '</div></section>');
      }
    });

    $('cerita').innerHTML = html.join('');
  }

  /* ============================================================
     Giliran latar
     Hanya bab yang sedang terlihat yang bergilir; video hanya
     diputar selama lapisnya aktif DAN babnya terlihat.
     ============================================================ */
  function pasangGiliran(){
    var bab = Array.prototype.slice.call(document.querySelectorAll('[data-bab]'))
      .filter(function(el){ return el.querySelector('.latar'); });

    bab.forEach(function(el){
      var lapis = el.querySelectorAll('.lapis');
      var titik = el.querySelectorAll('.titik button');
      var ke = 0, jam = null, terlihat = false;

      function tampil(i){
        if (lapis[ke]){
          lapis[ke].classList.remove('aktif');
          var vl = lapis[ke].querySelector('video'); if (vl) vl.pause();
        }
        ke = (i + lapis.length) % lapis.length;
        lapis[ke].classList.add('aktif');
        titik.forEach(function(t, j){ t.setAttribute('aria-current', j === ke ? 'true' : 'false'); });
        var v = lapis[ke].querySelector('video');
        if (v && terlihat){ v.preload = 'auto'; v.play().catch(function(){}); }
        // lapis berikutnya disiapkan supaya tidak muncul kosong
        var nx = lapis[(ke + 1) % lapis.length];
        var nv = nx && nx.querySelector('video'); if (nv) nv.preload = 'metadata';
        jadwal();
      }
      function lama(){
        var d = Number(lapis[ke].dataset.durasi || 0);
        return d ? Math.min(15000, Math.max(GILIR_FOTO, d)) : GILIR_FOTO;
      }
      function jadwal(){
        clearTimeout(jam);
        if (!terlihat || kurangi || lapis.length < 2 || document.hidden) return;
        jam = setTimeout(function(){ tampil(ke + 1); }, lama());
      }

      el._lihat = function(v){
        terlihat = v;
        el.classList.toggle('jalan', v);
        var vid = lapis[ke] && lapis[ke].querySelector('video');
        if (vid){ v ? vid.play().catch(function(){}) : vid.pause(); }
        jadwal();
      };
      el._jeda = function(){ clearTimeout(jam); var vid = lapis[ke] && lapis[ke].querySelector('video'); if (vid) vid.pause(); };
      titik.forEach(function(t){ t.addEventListener('click', function(){ tampil(Number(t.dataset.ke)); }); });
      el.querySelectorAll('[data-geser]').forEach(function(t){
        t.addEventListener('click', function(){ tampil(ke + Number(t.dataset.geser)); });
      });
      /* Usap mendatar di mana saja pada bab = geser. Usap tegak tetap
         menggulir halaman: hanya gerak yang jelas mendatar yang dihitung. */
      if (lapis.length > 1){
        var x0 = null, y0 = 0;
        el.addEventListener('touchstart', function(e){ x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
        el.addEventListener('touchend', function(e){
          if (x0 === null) return;
          var dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
          if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) tampil(ke + (dx < 0 ? 1 : -1));
        }, { passive: true });
      }
    });

    if (!('IntersectionObserver' in window)){
      bab.forEach(function(el){ el._lihat(true); });
      return;
    }
    var pengamat = new IntersectionObserver(function(masuk){
      masuk.forEach(function(x){ x.target._lihat(x.isIntersecting); });
    }, { threshold: 0.2 });
    bab.forEach(function(el){ pengamat.observe(el); });

    document.addEventListener('visibilitychange', function(){
      bab.forEach(function(el){ document.hidden ? el._jeda() : el._lihat(el.classList.contains('jalan')); });
    });
  }

  /* ============================================================
     Penampil: semua foto/video satu bab, bisa digeser
     ============================================================ */
  var kaca = $('kaca'), daftarKaca = [], iKaca = 0, pemanggil = null;

  function gambarKaca(){
    var f = daftarKaca[iKaca];
    $('kacaIsi').innerHTML = f.jenis === 'video'
      ? '<video controls autoplay playsinline src="' + esc(url(f.jalur)) + '"' + (f.kecil ? ' poster="' + esc(url(f.kecil)) + '"' : '') + '></video>'
      : '<img src="' + esc(url(f.jalur)) + '" alt="' + esc(f.keterangan || '') + '">';
    $('kacaKet').textContent = f.keterangan || '';
    $('kacaHitung').textContent = daftarKaca.length > 1 ? (iKaca + 1) + ' / ' + daftarKaca.length : '';
    $('kacaKiri').hidden = $('kacaKanan').hidden = daftarKaca.length < 2;
  }
  function bukaKaca(kunci, i){
    daftarKaca = mediaBab[kunci] || [];
    if (!daftarKaca.length) return;
    iKaca = i || 0;
    pemanggil = document.activeElement;
    if (window.Motion) Motion.gulir.henti();
    gambarKaca();
    kaca.hidden = false;
    document.body.style.overflow = 'hidden';
    $('kacaTutup').focus();
  }
  function tutupKaca(){
    kaca.hidden = true;
    $('kacaIsi').innerHTML = '';
    document.body.style.overflow = '';
    if (pemanggil && pemanggil.focus) pemanggil.focus();
  }
  function geser(n){ iKaca = (iKaca + n + daftarKaca.length) % daftarKaca.length; gambarKaca(); }

  document.addEventListener('click', function(e){
    var t = e.target.closest('[data-lihat]');
    if (t) bukaKaca(t.dataset.lihat, Number(t.dataset.i || 0));
  });
  $('kacaTutup').addEventListener('click', tutupKaca);
  $('kacaKiri').addEventListener('click', function(){ geser(-1); });
  $('kacaKanan').addEventListener('click', function(){ geser(1); });
  kaca.addEventListener('click', function(e){ if (e.target === kaca || e.target.id === 'kacaIsi') tutupKaca(); });
  document.addEventListener('keydown', function(e){
    if (kaca.hidden) return;
    if (e.key === 'Escape') tutupKaca();
    if (e.key === 'ArrowLeft') geser(-1);
    if (e.key === 'ArrowRight') geser(1);
  });
  var sentuhX = null;
  kaca.addEventListener('touchstart', function(e){ sentuhX = e.touches[0].clientX; }, { passive: true });
  kaca.addEventListener('touchend', function(e){
    if (sentuhX === null) return;
    var dx = e.changedTouches[0].clientX - sentuhX; sentuhX = null;
    if (Math.abs(dx) > 50 && daftarKaca.length > 1) geser(dx < 0 ? 1 : -1);
  });

  /* ============================================================
     Ucapan tamu: muncul satu per satu, berurutan dari yang pertama
     masuk, berputar selama halaman dibuka.
     ============================================================ */
  var LAMA_UCAP = 7000, JEDA_UCAP = 1600, KUNCI_UCAP = 'kenangan-ucapan';
  /* Tamu bisa menyembunyikan ucapan lewat tombol gelembung (atau ×) dan
     menyalakannya lagi; pilihannya diingat di peramban ini. Bawaan:
     tampil. */
  function putarUcapan(daftar){
    if (!daftar.length) return;
    var wadah = $('ucapan'), btn = $('btnUcapan'), i = 0, jam = null, nyala = false, kiri = true;
    var lebar = matchMedia('(min-width: 900px)');

    function ingat(v){ try { v ? localStorage.removeItem(KUNCI_UCAP) : localStorage.setItem(KUNCI_UCAP, 'mati'); } catch (e) {} }
    function tersimpanMati(){ try { return localStorage.getItem(KUNCI_UCAP) === 'mati'; } catch (e) { return false; } }

    function satu(){
      if (!nyala) return;
      if (document.hidden){ jam = setTimeout(satu, 2000); return; }
      var u = daftar[i % daftar.length]; i++;
      wadah.classList.toggle('kanan', lebar.matches && !kiri);
      kiri = !kiri;
      wadah.innerHTML = '<div class="ucap">'
        + '<div class="siapa"><span class="nama">' + esc(u.nama) + '</span>'
        + (u.hadir === 'Hadir' ? '<span class="hadir">hadir</span>' : '') + '</div>'
        + '<p class="pesan">' + esc(u.pesan) + '</p>'
        + '<button class="tutup" type="button" aria-label="Sembunyikan ucapan">&times;</button></div>';
      var el = wadah.firstChild;
      el.querySelector('.tutup').addEventListener('click', function(){ ingat(false); atur(false); });
      requestAnimationFrame(function(){ requestAnimationFrame(function(){ el.classList.add('in'); }); });
      jam = setTimeout(function(){
        el.classList.remove('in');
        jam = setTimeout(satu, kurangi ? JEDA_UCAP : 600 + JEDA_UCAP);
      }, LAMA_UCAP);
    }
    function atur(v, jeda){
      nyala = v;
      clearTimeout(jam);
      btn.setAttribute('aria-pressed', v ? 'true' : 'false');
      btn.setAttribute('aria-label', v ? 'Sembunyikan ucapan tamu' : 'Tampilkan ucapan tamu');
      if (v) jam = setTimeout(satu, jeda == null ? 400 : jeda);
      else wadah.innerHTML = '';
    }
    btn.classList.add('show');
    btn.addEventListener('click', function(){ var v = !nyala; ingat(v); atur(v); });
    atur(!tersimpanMati(), 2500);
  }

  /* ============================================================
     Musik dan gulir otomatis — sama seperti undangan
     ============================================================ */
  var Musik = (function(){
    var btn = $('btnMusik'), audio = null, aktif = false;
    function pudar(ke){
      var langkah = (ke - audio.volume) / 30, n = 0;
      var t = setInterval(function(){
        audio.volume = Math.min(1, Math.max(0, audio.volume + langkah));
        if (++n >= 30){ clearInterval(t); audio.volume = ke; if (ke === 0) audio.pause(); }
      }, 40);
    }
    function nyala(){
      if (!M.BACKSOUND_URL) return;
      if (!audio){ audio = new Audio(M.BACKSOUND_URL); audio.loop = true; audio.volume = 0; }
      audio.play().then(function(){ pudar(0.42); }).catch(function(){});
      aktif = true; btn.classList.add('on'); btn.classList.remove('off');
      btn.setAttribute('aria-label', 'Matikan musik latar');
    }
    function padam(){
      if (audio) pudar(0);
      aktif = false; btn.classList.remove('on'); btn.classList.add('off');
      btn.setAttribute('aria-label', 'Nyalakan musik latar');
    }
    btn.addEventListener('click', function(){ aktif ? padam() : nyala(); });
    document.addEventListener('visibilitychange', function(){ if (document.hidden && aktif) padam(); });
    return {
      tampilkan: function(){ if (M.BACKSOUND_URL) btn.classList.add('show'); },
      mulai: nyala
    };
  })();

  function siapkanGulir(){
    var btn = $('btnGulir');
    if (!window.Motion) return false;
    var bisa = Motion.gulir.pasang({
      kabar: function(jalan){
        btn.setAttribute('aria-pressed', jalan ? 'true' : 'false');
        btn.setAttribute('aria-label', jalan ? 'Hentikan gulir otomatis' : 'Gulir otomatis');
      }
    });
    if (!bisa) return false;
    btn.addEventListener('click', function(){ Motion.gulir.alih(); });
    btn.addEventListener('pointerdown', function(e){ e.stopPropagation(); });
    btn.addEventListener('keydown', function(e){ e.stopPropagation(); });
    btn.classList.add('show');
    return true;
  }

  /* Tombol musik dan gulir tampil sejak halaman siap; "Putar kenangan"
     di sampul menyalakan keduanya sekaligus dengan satu sentuhan. */
  function pasangPutar(){
    var tombol = $('btnPutar');
    var gulir = siapkanGulir();
    Musik.tampilkan();
    tombol.hidden = false;
    tombol.addEventListener('pointerdown', function(e){ e.stopPropagation(); });
    tombol.addEventListener('click', function(){
      Musik.mulai();
      tombol.hidden = true;
      var awal = document.querySelector('#cerita > :first-child');
      if (awal) awal.scrollIntoView({ behavior: kurangi ? 'auto' : 'smooth' });
      if (gulir) setTimeout(function(){ Motion.gulir.mulai(); }, kurangi ? 0 : 1400);
    });
  }

  /* ============================================================
     Reveal
     ============================================================ */
  function hidupkanReveal(){
    var item = document.querySelectorAll('.reveal');
    if (kurangi || !('IntersectionObserver' in window)){
      item.forEach(function(el){ el.classList.add('in'); });
      return;
    }
    var p = new IntersectionObserver(function(masuk){
      masuk.forEach(function(x){ if (x.isIntersecting){ x.target.classList.add('in'); p.unobserve(x.target); } });
    }, { rootMargin: '0px 0px -8% 0px', threshold: 0.06 });
    item.forEach(function(el){ p.observe(el); });
  }

  /* ============================================================
     Muat — pintu tamu atau pratinjau pemilik
     ============================================================ */
  function belumAda(pesan, html){
    if (html) $('sampulKalimat').innerHTML = html; else $('sampulKalimat').textContent = pesan;
    hidupkanReveal();
    document.body.dataset.siap = 'kosong';
  }

  var pratinjau = new URLSearchParams(location.search).get('pratinjau') === '1';
  function sesiDasbor(){
    try { var s = JSON.parse(localStorage.getItem('dasbor-sesi') || 'null'); return s && s.akses ? s : null; }
    catch (e) { return null; }
  }
  function pasangPita(d){
    var pita = $('pita');
    if (!d.undangan_terbit)      pita.innerHTML = '<b>Pratinjau</b> Undangan masih draf — tamu belum bisa membuka halaman ini.';
    else if (!d.kenangan_terbit) pita.innerHTML = '<b>Pratinjau</b> Belum diterbitkan — tamu belum melihat halaman ini.';
    else { pita.innerHTML = '<b>Pratinjau</b> Sudah terbit — beginilah yang dilihat tamu.'; pita.className = 'terbit'; }
    pita.hidden = false;
    document.title = 'Pratinjau · ' + document.title;
  }
  function minta(){
    if (!pratinjau){
      return fetch(M.SB.url + '/rest/v1/rpc/terimakasih_isi', {
        method: 'POST',
        headers: { apikey: M.SB.key, Authorization: 'Bearer ' + M.SB.key, 'Content-Type': 'application/json' },
        body: JSON.stringify({ p_slug: M.slugPasangan() })
      }).then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
    }
    var sesi = sesiDasbor();
    if (!sesi) return Promise.reject({ pesan: 'masuk' });
    return fetch(M.SB.url + '/rest/v1/rpc/terimakasih_pratinjau', {
      method: 'POST',
      headers: { apikey: M.SB.key, Authorization: 'Bearer ' + sesi.akses, 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_slug: M.slugPasangan() })
    }).then(function(r){
      if (r.status === 401) throw { pesan: 'habis' };
      if (r.status === 403) throw { pesan: 'bukan' };
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }
  var KABAR_PRATINJAU = {
    masuk: 'Pratinjau hanya bisa dibuka dari dasbor. <a href="/dasbor">Masuk ke dasbor</a>, lalu tekan Pratinjau.',
    habis: 'Sesi dasbor sudah habis. <a href="/dasbor">Masuk lagi</a>, lalu tekan Pratinjau.',
    bukan: 'Akun yang sedang masuk bukan pemilik undangan ini.'
  };

  minta()
  .then(function(d){
    if (!d || d.aktif !== true){ belumAda('Halaman ini belum tersedia.'); return; }
    if (d.pratinjau) pasangPita(d);
    bangun(d);
    pasangGiliran();
    aturTengah();
    addEventListener('resize', aturTengah);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(aturTengah);
    hidupkanReveal();
    pasangPutar();
    if (K.berlaku(d.blok, 'ucapan').tampil){
      // dari server terbaru dulu; ditampilkan dari yang pertama masuk
      putarUcapan((d.ucapan || []).slice().reverse());
    }
    document.body.dataset.siap = 'isi';
  })
  .catch(function(e){
    if (e && KABAR_PRATINJAU[e.pesan]){ belumAda('', KABAR_PRATINJAU[e.pesan]); return; }
    belumAda('Belum bisa dimuat. Coba muat ulang halaman.');
  });
})();
</script>
