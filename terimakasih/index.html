<html lang="id">
<head>

<meta name="description" content="Terima kasih atas doa dan kehadiran Anda.">
<meta property="og:type" content="website">

<meta property="og:description" content="Terima kasih atas doa dan kehadiran Anda.">

     baru diketahui sesudah JS jalan. Perlu render di server — tahap 2. -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Cormorant:ital,wght@0,400;1,300;1,400&family=Karla:wght@300;400;500;700&display=swap" rel="stylesheet">

<!--
  Halaman kenangan. docs/kenangan.md.

  Kerangkanya sama dengan undangan — sampul, seksi berselang gelap-terang,
  ukir, reveal — tapi hubungan gelap-terangnya dibalik: latar belakangnya
  acaranya sendiri, dan tulisan mengambang di atasnya. Undangan itu janji;
  halaman ini ingatan.

  Gulir = waktu berjalan. Babak-babaknya baris `acara` yang sama dengan
  undangan, dalam urutan hari itu. Tamu yang datang sore tidak melihat
  akadnya; di sini mereka melihat seluruh harinya, berurutan.

  Halaman menyesuaikan bahan, dan tidak pernah kosong:
    babak berfoto     → foto penuh layar, pan lambat
    babak tanpa foto  → kartu teks di atas nila
    tanpa babak sama sekali → sampul, angka, ucapan, penutup
-->

<style>
:root{
  --nila:#131E33; --nila-2:#1B2A46; --nila-3:#0D1626;
  --jati:#4A3323; --kuningan:#C39A5C; --kuningan-dim:#8C6A3A;
  --kapur:#EDE7D9; --kapur-2:#E2DAC7; --daun:#7C8B63;
  --display:'Marcellus','Times New Roman',serif;
  --script:'Cormorant',Georgia,serif;
  --body:'Karla','Helvetica Neue',Arial,sans-serif;
  --pad:clamp(20px,6vw,64px);
}
*{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{
  font-family:var(--body);background:var(--nila);color:var(--kapur);
  line-height:1.7;font-weight:300;overflow-x:hidden;-webkit-font-smoothing:antialiased;
}
img,svg{display:block;max-width:100%;}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
[hidden]{display:none!important;}

section{padding:clamp(64px,14vw,110px) var(--pad);position:relative;}
.wrap{max-width:660px;margin:0 auto;}
.wrap-lebar{max-width:980px;margin:0 auto;}
.center{text-align:center;}
.eyebrow{font-size:11px;letter-spacing:.34em;text-transform:uppercase;font-weight:500;color:var(--kuningan);}
h1.judul,h2.judul{font-family:var(--display);font-weight:400;font-size:clamp(25px,6.6vw,36px);letter-spacing:.05em;margin-top:12px;}
.lead{font-size:14.5px;margin-top:14px;color:rgba(237,231,217,.7);max-width:470px;margin-inline:auto;white-space:pre-line;}

.on-paper{background:var(--kapur);color:var(--nila);}
.on-paper .eyebrow{color:var(--kuningan-dim);}
.on-paper .lead{color:rgba(19,30,51,.7);}
.on-paper::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(94deg,transparent 0 3px,rgba(74,51,35,.028) 3px 4px);
}
.on-paper > *{position:relative;}

/* Ornamen dipanggil lewat <use>; selektor turunan tidak menembus shadow
   tree-nya, jadi warnanya lewat custom property. Sama seperti di undangan. */
.ukir{--ukir-garis:var(--kuningan);--ukir-garis-dim:var(--kuningan-dim);--ukir-isi:var(--kuningan);}
.on-paper .ukir{--ukir-garis:var(--jati);--ukir-garis-dim:var(--jati);--ukir-isi:var(--jati);}
.divider{width:min(240px,62vw);height:40px;margin:26px auto 0;opacity:.9;}

.reveal{opacity:0;transform:translateY(26px);}
.reveal.in{opacity:1;transform:none;transition:opacity .9s ease,transform .9s cubic-bezier(.22,.8,.3,1);}

/* ---------- LATAR FOTO ----------
   Satu aturan untuk sampul dan setiap babak. Fotonya <img>, bukan
   background-image: ia bisa lazy, punya alt, dan ruangnya tidak
   bergantung pada CSS yang menunggu JS.

   Pan lambat: foto diam yang bergeser pelan terasa hidup tanpa biaya
   video. Animasinya hanya berjalan selama seksinya terlihat (.jalan),
   supaya HP tidak menggerakkan enam foto penuh layar yang tidak dilihat
   siapa pun. Arahnya berselang per babak, supaya gulir tidak terasa
   seperti satu gerakan yang diulang. */
.latar{position:absolute;inset:0;overflow:hidden;background:var(--nila-3);}
.latar img{
  width:100%;height:100%;object-fit:cover;max-width:none;
  transform:scale(1.08);transform-origin:50% 50%;
  animation:pan 28s ease-in-out infinite alternate;animation-play-state:paused;
}
.jalan .latar img{animation-play-state:running;}
.latar.balik img{animation-name:pan-balik;}
@keyframes pan{
  from{transform:scale(1.08) translate3d(-1.6%,-1%,0);}
  to  {transform:scale(1.16) translate3d(1.6%,1%,0);}
}
@keyframes pan-balik{
  from{transform:scale(1.16) translate3d(1.6%,-1%,0);}
  to  {transform:scale(1.08) translate3d(-1.6%,1%,0);}
}
/* Gelap di bawah, tempat tulisannya duduk — terang di atas, tempat
   fotonya bicara. Tanpa ini teks kapur di atas gaun putih tidak terbaca. */
.latar::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(to top,rgba(9,14,24,.92) 0%,rgba(9,14,24,.55) 38%,rgba(9,14,24,.12) 72%,rgba(9,14,24,.3) 100%);
}

/* ---------- SAMPUL ---------- */
#atas{
  min-height:min(100svh,780px);display:flex;flex-direction:column;
  justify-content:center;align-items:center;text-align:center;overflow:hidden;
  background:radial-gradient(110% 70% at 50% 100%,#22355A 0%,var(--nila) 55%,var(--nila-3) 100%);
}
#atas > :not(.latar){position:relative;}
#atas .latar::after{background:radial-gradient(90% 70% at 50% 50%,rgba(9,14,24,.55) 0%,rgba(9,14,24,.82) 100%);}
.nama-besar{font-family:var(--display);font-size:clamp(30px,9vw,52px);letter-spacing:.04em;line-height:1.2;margin-top:18px;}
.nama-amp{font-family:var(--script);font-style:italic;font-weight:300;color:var(--kuningan);}
.tanggal{margin-top:18px;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--kuningan);}
.salam{font-family:var(--script);font-style:italic;font-size:clamp(17px,4.4vw,21px);line-height:1.75;margin:30px auto 0;max-width:520px;color:var(--kapur);white-space:pre-line;}

/* ---------- BABAK ---------- */
.babak{
  min-height:min(100svh,860px);display:flex;align-items:flex-end;
  padding-bottom:clamp(56px,12vw,96px);overflow:hidden;
}
.babak .isi{position:relative;max-width:620px;}
.babak .urut{font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--kuningan);font-weight:500;}
.babak .waktu{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:rgba(237,231,217,.62);margin-top:10px;}
.babak h2{font-family:var(--display);font-weight:400;font-size:clamp(30px,8.4vw,50px);letter-spacing:.04em;line-height:1.15;margin-top:8px;}
.babak .kalimat{font-family:var(--script);font-style:italic;font-size:clamp(18px,4.6vw,23px);line-height:1.6;margin-top:14px;color:var(--kapur);max-width:520px;}
.babak .ke-galeri{display:inline-block;margin-top:20px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--kuningan);text-decoration:none;border-bottom:1px solid rgba(195,154,92,.45);padding-bottom:2px;}
/* Babak tanpa foto: kartu teks di atas nila. Rapi, bukan kotak kosong
   menunggu foto yang tidak datang. Lebih pendek dari babak berfoto —
   tidak ada gambar yang perlu ruang. */
.babak.teks{
  min-height:auto;align-items:center;justify-content:center;text-align:center;
  padding:clamp(72px,16vw,120px) var(--pad);
  background:radial-gradient(90% 80% at 50% 0%,var(--nila-2) 0%,var(--nila) 60%,var(--nila-3) 100%);
  border-top:1px solid rgba(195,154,92,.12);
}
.babak.teks .isi{margin:0 auto;}
.babak.teks .kalimat{margin-inline:auto;}

/* ---------- ANGKA ---------- */
.angka{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:22px;margin-top:34px;}
.angka div{border-top:1px solid rgba(74,51,35,.22);padding-top:14px;}
.angka b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(30px,8vw,42px);letter-spacing:.03em;color:var(--jati);line-height:1.1;}
.angka span{display:block;margin-top:6px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:rgba(19,30,51,.6);}

/* ---------- GALERI ----------
   Kolom, bukan grid: foto potret dan lanskap tercampur, dan grid
   memaksa semuanya dipotong seragam. Di halaman kenangan galeri turun
   pangkat jadi arsip — wajah tiap babak sudah tampil di atas. */
.galeri{columns:2;column-gap:12px;margin-top:38px;}
@media (min-width:720px){ .galeri{columns:3;column-gap:16px;} }
.galeri figure{break-inside:avoid;margin:0 0 12px;position:relative;}
@media (min-width:720px){ .galeri figure{margin-bottom:16px;} }
.galeri button.buka{display:block;width:100%;padding:0;border-radius:2px;overflow:hidden;background:var(--kapur-2);}
.galeri img{width:100%;height:auto;transition:transform .5s cubic-bezier(.22,.8,.3,1);}
.galeri button.buka:hover img,.galeri button.buka:focus-visible img{transform:scale(1.04);}
.galeri button.buka:focus-visible{outline:2px solid var(--kuningan-dim);outline-offset:3px;}
.galeri figcaption{font-size:12px;color:rgba(19,30,51,.62);margin-top:6px;line-height:1.5;}

/* ---------- LIGHTBOX ---------- */
#kaca{
  position:fixed;inset:0;z-index:60;background:rgba(9,14,24,.94);
  display:flex;align-items:center;justify-content:center;padding:clamp(12px,4vw,40px);
}
#kaca img{max-width:100%;max-height:82svh;width:auto;object-fit:contain;}
#kaca .ket{position:absolute;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));text-align:center;font-size:13px;color:rgba(237,231,217,.8);padding:0 20px;}
#kacaTutup{position:absolute;top:max(12px,env(safe-area-inset-top));right:14px;width:44px;height:44px;font-size:26px;line-height:1;color:var(--kapur);}
#kacaTutup:focus-visible{outline:2px solid var(--kuningan);outline-offset:2px;}

/* ---------- UCAPAN ---------- */
.ucapan-list{margin-top:36px;display:grid;gap:14px;text-align:left;}
.kartu{background:var(--nila-2);border:1px solid rgba(195,154,92,.18);border-radius:3px;padding:18px 18px 16px;}
.kartu-kepala{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
.kartu-nama{font-family:var(--display);font-size:16.5px;letter-spacing:.02em;}
.lencana{font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:3px 8px;border-radius:99px;border:1px solid currentColor;opacity:.85;}
.l-hadir{color:var(--daun);} .l-belum{color:var(--kuningan);} .l-tidak{color:rgba(237,231,217,.45);}
.kartu-pesan{margin-top:9px;font-size:14.5px;color:rgba(237,231,217,.84);white-space:pre-wrap;overflow-wrap:anywhere;}
.kartu-waktu{margin-top:10px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:rgba(237,231,217,.38);}

.balasan{
  margin-top:14px;padding:13px 15px;border-left:2px solid var(--kuningan-dim);
  background:rgba(195,154,92,.07);border-radius:0 3px 3px 0;
}
.balasan-label{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--kuningan);}
.balasan-teks{margin-top:6px;font-size:14px;color:rgba(237,231,217,.88);white-space:pre-wrap;overflow-wrap:anywhere;}

.kabar{margin-top:30px;font-size:14px;color:rgba(237,231,217,.55);}

/* ---------- PENUTUP ---------- */
#penutup .salam{color:var(--nila);margin-top:20px;}
.tutup{padding:clamp(48px,10vw,72px) var(--pad);text-align:center;border-top:1px solid rgba(195,154,92,.16);}
.tutup a{color:var(--kuningan);text-decoration:none;border-bottom:1px solid rgba(195,154,92,.4);}

/* ---------- PITA PRATINJAU ----------
   Hanya untuk pemilik yang membuka ?pratinjau=1 dari dasbor. Menempel di
   atas supaya tidak pernah ada tangkapan layar pratinjau yang dikira
   halaman yang sudah dilihat tamu. */
#pita{
  position:sticky;top:0;z-index:50;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;
  padding:9px 16px;font-size:12px;letter-spacing:.04em;text-align:center;
  background:var(--kuningan);color:var(--nila-3);
}
#pita b{font-weight:700;letter-spacing:.18em;text-transform:uppercase;font-size:10.5px;}
#pita.terbit{background:var(--daun);color:var(--kapur);}
#atas .salam a{color:var(--kuningan);}

@media (prefers-reduced-motion:reduce){
  .reveal,.reveal.in{opacity:1;transform:none;transition:none;}
  .galeri img{transition:none;}
  .latar img{animation:none;transform:none;}
}
</style>
</head>

<!-- Urutan blok di bawah ini tetap dan sengaja tidak bisa diubah dari
     dasbor: sampul selalu pertama, penutup selalu terakhir, ucapan
     selalu sesudah momen. Yang bisa diatur pasangan: blok mana yang

<div id="pita" hidden role="status"></div>

<section id="atas">

<script>
(function(){
  'use strict';
  var M = window.MENGUNDANG;
  var $ = function(id){ return document.getElementById(id); };

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  /* ---------- Pasangan mana ini? ---------- */
  /* Penentu pasangan tinggal satu, di assets/varian.js, dipakai bersama
     halaman undangan. Salinan di sini dulu berakhir beda perilaku. */
  var slugPasangan = M.slugPasangan;

  var BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli',
               'Agustus','September','Oktober','November','Desember'];

  function tanggalPanjang(iso){
    if (!iso) return '';
    var p = String(iso).slice(0,10).split('-');
    if (p.length !== 3) return '';
    return Number(p[2]) + ' ' + BULAN[Number(p[1]) - 1] + ' ' + p[0];
  }

  function waktuSingkat(iso){
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d)) return '';
    return d.getDate() + ' ' + BULAN[d.getMonth()].slice(0,3) + ' ' + d.getFullYear();
  }

  function kelasHadir(h){
    if (h === 'Hadir') return 'l-hadir';
    if (h === 'Tidak hadir') return 'l-tidak';
    return 'l-belum';
  }

  /* ---------- Blok: bawaan, ditimpa yang disimpan pasangan ----------
     Baris kenangan_blok yang tidak ada berarti bawaan. Pasangan yang
     tidak pernah membuka panel 9 tetap mendapat halaman utuh dengan
     tulisan yang masuk akal — itu syarat, bukan fitur. Daftar bawaannya
     di assets/kenangan.js, dibaca juga oleh dasbor sebagai placeholder. */
  function blok(d, kunci){ return window.Kenangan.berlaku(d.blok, kunci); }

  function latarHtml(f, balik, segera){
    /* Versi penuh, bukan thumbnail: ia mengisi layar. Babak pertama
       dimuat segera karena ia yang pertama terlihat sesudah sampul;
       sisanya menunggu digulir. */
    return '<div class="latar' + (balik ? ' balik' : '') + '" aria-hidden="true">'
      +   '<img src="' + esc(window.Gambar.url(f.jalur)) + '" alt=""'
      +        (segera ? '' : ' loading="lazy"') + ' decoding="async">'
      + '</div>';
  }

  /* ---------- Menggambar ---------- */
  function gambarAtas(d){
    var pria   = (d.mempelai && d.mempelai.pria   && d.mempelai.pria.panggilan)   || '';
    var wanita = (d.mempelai && d.mempelai.wanita && d.mempelai.wanita.panggilan) || '';
    if (pria || wanita){
      $('namaBesar').innerHTML = esc(pria) + ' <span class="nama-amp">&amp;</span> ' + esc(wanita);
      document.title = 'Terima Kasih — ' + pria + ' & ' + wanita;
      $('penutupNama').textContent = pria + ' & ' + wanita;
    }
    $('tanggal').textContent = tanggalPanjang(d.tanggal_acara);

    var b = blok(d, 'sampul');
    $('atasEyebrow').textContent = b.judul;
    $('atasSalam').textContent   = b.teks;

    /* Sampulnya pun acaranya sendiri: latar babak pertama yang punya
       foto, digelapkan supaya nama tetap yang paling terbaca. */
    var pertama = (d.babak || []).filter(function(x){ return x.latar; })[0];
    if (pertama){
      $('atas').insertAdjacentHTML('afterbegin', latarHtml(pertama.latar, false, true));
    }
  }

  function gambarPembuka(d){
    var b = blok(d, 'pembuka');
    /* "Inilah hari itu, berurutan" tanpa satu babak pun di bawahnya
       adalah janji yang tidak ditepati. Tanpa babak, pembuka diam. */
    if (!b.tampil || !(d.babak || []).length) return;
    $('pembukaJudul').textContent = b.judul;
    $('pembukaTeks').textContent  = b.teks || '';
    $('pembuka').hidden = false;
  }

  function gambarBabak(d, galeriTampil){
    var daftar = d.babak || [];
    var nBerfoto = 0;
    $('babakDaftar').innerHTML = daftar.map(function(x, i){
      var waktu = [x.tanggal, x.jam].filter(Boolean).join(' · ');
      var sisa  = Math.max(0, (x.jumlah_foto || 0) - 1);
      var ke    = (galeriTampil && sisa > 0)
        ? '<a class="ke-galeri" href="#galeri">' + sisa + ' foto lagi di galeri</a>' : '';
      var isi = '<div class="isi' + (x.latar ? '' : ' wrap') + '">'
        +   '<p class="urut reveal">' + (i + 1) + ' / ' + daftar.length + '</p>'
        +   (waktu ? '<p class="waktu reveal">' + esc(waktu) + '</p>' : '')
        +   '<h2 class="reveal">' + esc(x.nama || 'Acara') + '</h2>'
        +   (x.teks ? '<p class="kalimat reveal">' + esc(x.teks) + '</p>' : '')
        +   ke
        + '</div>';

      if (!x.latar){
        return '<section class="babak teks" data-babak="' + esc(x.id) + '">' + isi + '</section>';
      }
      nBerfoto++;
      return '<section class="babak" data-babak="' + esc(x.id) + '">'
        +   latarHtml(x.latar, nBerfoto % 2 === 0, nBerfoto === 1)
        +   isi
        + '</section>';
    }).join('');
  }

  function gambarAngka(d){
    var b = blok(d, 'angka');
    var a = d.angka || {};
    /* `hadir` lama tetap dibaca: ia satu-satunya angka sebelum 028. */
    var hadir = a.hadir != null ? a.hadir : d.hadir;
    var isi = [
      [hadir,    'tamu hadir'],
      [a.ucapan, 'ucapan & doa'],
      [a.foto,   'foto'],
      [a.babak,  'rangkaian acara']
    ].filter(function(x){ return x[0] > 0; });

    /* Hanya angka yang ada. Server mengirim null untuk nol, supaya
       pasangan yang belum merekap tidak memajang "0 tamu hadir". */
    if (!b.tampil || !isi.length) return;
    $('angkaJudul').textContent = b.judul;
    if (b.teks){ $('angkaTeks').textContent = b.teks; $('angkaTeks').hidden = false; }
    $('angkaIsi').innerHTML = isi.map(function(x){
      return '<div><b>' + Number(x[0]).toLocaleString('id-ID') + '</b><span>' + esc(x[1]) + '</span></div>';
    }).join('');
    $('angka').hidden = false;
  }

  function gambarGaleri(d){
    var b = blok(d, 'galeri');
    var foto = d.foto || [];
    if (!b.tampil || !foto.length) return false;   // tanpa foto, bagiannya tidak muncul
    $('galeriJudul').textContent = b.judul;
    if (b.teks){ $('galeriTeks').textContent = b.teks; $('galeriTeks').hidden = false; }
    $('galeriGrid').innerHTML = foto.map(function(f, i){
      /* lebar/tinggi memesan ruang sebelum gambarnya turun — tanpa itu
         galeri melompat-lompat di jaringan pelan. */
      var rasio = (f.lebar && f.tinggi) ? ' style="aspect-ratio:' + f.lebar + '/' + f.tinggi + '"' : '';
      var src   = window.Gambar.url(f.kecil || f.jalur);
      var ket   = f.keterangan ? '<figcaption>' + esc(f.keterangan) + '</figcaption>' : '';
      return '<figure class="reveal">'
        +   '<button class="buka" type="button" data-i="' + i + '" aria-label="Perbesar foto ' + (i+1) + '">'
        +     '<img src="' + esc(src) + '" alt="' + esc(f.keterangan || 'Foto acara') + '"'
        +          ' loading="lazy" decoding="async"' + rasio + '>'
        +   '</button>' + ket
        + '</figure>';
    }).join('');
    $('galeri').hidden = false;
    return true;
  }

  function gambarUcapan(d){
    var b = blok(d, 'ucapan');
    if (!b.tampil){ $('ucapan').hidden = true; return; }
    $('ucapanJudul').textContent = b.judul;
    $('ucapanTeks').textContent  = b.teks || '';
    $('ucapanTeks').hidden = !b.teks;

    var daftar = d.ucapan || [];
    var kabar = $('kabar');
    if (!daftar.length){
      kabar.textContent = 'Belum ada ucapan yang ditampilkan.';
      return;
    }
    kabar.hidden = true;
    $('ucapanList').innerHTML = daftar.map(function(u){
      var balasan = u.balasan
        ? '<div class="balasan">'
          +   '<p class="balasan-label">Balasan dari kami</p>'
          +   '<p class="balasan-teks">' + esc(u.balasan) + '</p>'
          + '</div>'
        : '';
      return '<article class="kartu reveal">'
        +   '<div class="kartu-kepala">'
        +     '<h3 class="kartu-nama">' + esc(u.nama) + '</h3>'
        +     '<span class="lencana ' + kelasHadir(u.hadir) + '">' + esc(u.hadir) + '</span>'
        +   '</div>'
        +   '<p class="kartu-pesan">' + esc(u.pesan) + '</p>'
        +   '<p class="kartu-waktu">' + esc(waktuSingkat(u.waktu)) + '</p>'
        +   balasan
        + '</article>';
    }).join('');
  }

  function gambarPenutup(d){
    var b = blok(d, 'penutup');
    $('penutupJudul').textContent = b.judul;
    $('penutupTeks').textContent  = b.teks || '';
    $('penutup').hidden = false;
  }

  /* ---------- Lightbox ---------- */
  var fotoAktif = [];
  var kaca = $('kaca'), kacaImg = $('kacaImg'), kacaKet = $('kacaKet');
  var pemanggil = null;

  function bukaKaca(i){
    var f = fotoAktif[i];
    if (!f) return;
    pemanggil = document.activeElement;
    kacaImg.src = window.Gambar.url(f.jalur);     // versi penuh, bukan thumbnail
    kacaImg.alt = f.keterangan || 'Foto acara';
    kacaKet.textContent = f.keterangan || '';
    kaca.hidden = false;
    document.body.style.overflow = 'hidden';
    $('kacaTutup').focus();
  }

  function tutupKaca(){
    kaca.hidden = true;
    kacaImg.removeAttribute('src');
    document.body.style.overflow = '';
    if (pemanggil && pemanggil.focus) pemanggil.focus();
  }

  $('galeriGrid').addEventListener('click', function(e){
    var b = e.target.closest('button.buka');
    if (b) bukaKaca(Number(b.dataset.i));
  });
  $('kacaTutup').addEventListener('click', tutupKaca);
  kaca.addEventListener('click', function(e){ if (e.target === kaca) tutupKaca(); });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && !kaca.hidden) tutupKaca();
  });

  /* ---------- Reveal dan pan ---------- */
  function hidupkanGerak(){
    var kurangi = matchMedia('(prefers-reduced-motion: reduce)').matches;
    var item = document.querySelectorAll('.reveal');
    if (kurangi || !('IntersectionObserver' in window)){
      item.forEach(function(el){ el.classList.add('in'); });
      return;
    }
    var pengamat = new IntersectionObserver(function(masuk){
      masuk.forEach(function(x){
        if (x.isIntersecting){ x.target.classList.add('in'); pengamat.unobserve(x.target); }
      });
    }, { rootMargin: '0px 0px -8% 0px', threshold: 0.06 });
    item.forEach(function(el){ pengamat.observe(el); });

    /* Pan hanya selama terlihat, dan berhenti lagi sesudah lewat. */
    var penggeser = new IntersectionObserver(function(masuk){
      masuk.forEach(function(x){ x.target.classList.toggle('jalan', x.isIntersecting); });
    }, { threshold: 0.01 });
    document.querySelectorAll('#atas, .babak').forEach(function(el){
      if (el.querySelector('.latar')) penggeser.observe(el);
    });
  }

  /* ---------- Muat ---------- */
  function belumAda(pesan){
    /* Tetap halaman utuh: sampul dan penutup kaki, bukan layar kosong. */
    $('atasSalam').textContent = pesan;
    $('ucapan').hidden = true;
    hidupkanGerak();
  }

  /* ---------- Pratinjau pemilik ----------
     ?pratinjau=1 dibuka dari dasbor. Sesinya dibaca dari localStorage
     yang sama dengan dasbor — karena itu dasbor selalu membuka pratinjau
     di asalnya sendiri (M.alamatPratinjau), bukan di subdomain pasangan.

     Isinya datang dari terimakasih_pratinjau, yang dibangun fungsi dalam
     yang SAMA dengan terimakasih_isi: yang terlihat di sini persis yang
     nanti dilihat tamu. Tanpa ?pratinjau=1 halaman ini tidak pernah
     menyentuh sesi, sekalipun pemiliknya sedang login — tamu dan pemilik
     yang membuka alamat tamu melihat hal yang sama. */
  var pratinjau = new URLSearchParams(location.search).get('pratinjau') === '1';

  function sesiDasbor(){
    try { var s = JSON.parse(localStorage.getItem('dasbor-sesi') || 'null'); return s && s.akses ? s : null; }
    catch (e) { return null; }
  }

  function pasangPita(d){
    var pita = $('pita');
    if (!d.undangan_terbit){
      pita.innerHTML = '<b>Pratinjau</b> Undangan masih draf — tamu belum bisa membuka halaman ini.';
    } else if (!d.kenangan_terbit){
      pita.innerHTML = '<b>Pratinjau</b> Belum diterbitkan — tamu belum melihat halaman ini.';
    } else {
      pita.innerHTML = '<b>Pratinjau</b> Sudah terbit — beginilah yang dilihat tamu.';
      pita.className = 'terbit';
    }
    pita.hidden = false;
    document.title = 'Pratinjau · ' + document.title;
  }

  function minta(){
    if (!pratinjau){
      return fetch(M.SB.url + '/rest/v1/rpc/terimakasih_isi', {
        method: 'POST',
        headers: { apikey: M.SB.key, Authorization: 'Bearer ' + M.SB.key, 'Content-Type': 'application/json' },
        body: JSON.stringify({ p_slug: slugPasangan() })
      }).then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
    }
    var sesi = sesiDasbor();
    if (!sesi) return Promise.reject({ pesan: 'masuk' });
    return fetch(M.SB.url + '/rest/v1/rpc/terimakasih_pratinjau', {
      method: 'POST',
      headers: { apikey: M.SB.key, Authorization: 'Bearer ' + sesi.akses, 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_slug: slugPasangan() })
    }).then(function(r){
      if (r.status === 401) throw { pesan: 'habis' };
      if (r.status === 403) throw { pesan: 'bukan' };
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }

  var KABAR_PRATINJAU = {
    masuk: 'Pratinjau hanya bisa dibuka dari dasbor. <a href="/dasbor">Masuk ke dasbor</a>, lalu tekan Pratinjau.',
    habis: 'Sesi dasbor sudah habis. <a href="/dasbor">Masuk lagi</a>, lalu tekan Pratinjau.',
    bukan: 'Akun yang sedang masuk bukan pemilik undangan ini.'
  };

  minta()
  .then(function(d){
    if (!d || d.aktif !== true){
      belumAda('Halaman ini belum tersedia.');
      return;
    }
    if (d.pratinjau) pasangPita(d);
    fotoAktif = d.foto || [];
    gambarAtas(d);
    gambarPembuka(d);
    var adaGaleri = gambarGaleri(d);
    gambarBabak(d, adaGaleri);
    gambarAngka(d);
    gambarUcapan(d);
    gambarPenutup(d);
    hidupkanGerak();
  })
  .catch(function(e){
    if (e && KABAR_PRATINJAU[e.pesan]){
      belumAda('');
      $('atasSalam').innerHTML = KABAR_PRATINJAU[e.pesan];   // teks tetap milik halaman, bukan data
      return;
    }
    belumAda('Belum bisa dimuat. Coba muat ulang halaman.');
  });
})();
</script>
</body>
</html>
